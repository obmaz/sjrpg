<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <link rel="manifest" href="/sjrpg/new/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/sjrpg/new/icons/guardian.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#102c29">
  <meta name="description" content="자연의 수호자 — 새로운 핵앤슬래시 모험">
  <title>자연의 수호자 · 새로운 모험</title>
  <link rel="preload" as="image" href="assets/assets/images/entry-splash.webp">
  <style>
    html,body{margin:0;background:#102c29;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
    #flutter-host{position:fixed;left:0;top:0;width:100%;height:100%}
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;box-sizing:border-box;color:#ecdfb5;font:14px system-ui,sans-serif;background:#0b211f linear-gradient(#071b18aa,#071b1810 48%,#071b18f5) center/cover;padding:24px;padding-bottom:max(24px,env(safe-area-inset-bottom));isolation:isolate}
    #loading::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(#071b1880,#071b1810 48%,#071b18f5),url("assets/assets/images/entry-splash.webp") center/cover no-repeat}
    .loading-brand{position:absolute;top:18%;left:16px;right:16px;text-shadow:0 2px 16px #000}
    #loading strong{display:block;font:700 30px system-ui,sans-serif;letter-spacing:2px;margin-bottom:12px}
    .loading-brand span{color:#aa9979;letter-spacing:1px}.loading-crest{display:block;width:58px;height:66px;margin:0 auto 14px;background:url("assets/assets/images/entry-crest.webp") center/contain no-repeat}
    #loading p{margin:14px 0 8px;color:#d2dfcc;line-height:1.6}
    #loading a{color:#bac8b7;margin-top:12px;font-size:12px;text-underline-offset:4px}
    .loading-track{width:240px;height:32px;box-sizing:border-box;padding:14px 21px;background:url("assets/assets/images/entry-loading-bar.webp") center/100% 100% no-repeat;overflow:hidden}
    .loading-track span{display:block;width:60%;height:3px;background:#aa9979;animation:loading-drift 1.8s ease-in-out infinite alternate}
    @keyframes loading-drift{to{transform:translateX(72px);opacity:.5}}
    @media(max-height:500px){.loading-brand{top:7%}.loading-crest{width:36px;height:41px;margin-bottom:6px}#loading strong{font-size:26px;margin-bottom:8px}#loading{padding-bottom:16px}#loading p{margin:10px 0 0}}
    @media(prefers-reduced-motion:reduce){.loading-track span{animation:none}}
  </style>
</head>
<body>
  <div id="flutter-host"></div>
  <div id="loading" role="status" aria-label="모험 준비 중">
    <div class="loading-brand"><i class="loading-crest" aria-hidden="true"></i><strong>자연의 수호자</strong><span>숲이 당신을 기다립니다</span></div>
    <div class="loading-track" aria-hidden="true"><span></span></div>
    <p>모험의 풍경을 불러오고 있어요</p>
    <a href="/sjrpg/legacy/">기존 모험 플레이</a>
  </div>
  <script>
    // Keep address-bar height changes stable, but rebase after a width change.
    const host = document.getElementById('flutter-host');
    const coarse = matchMedia('(pointer: coarse)').matches;
    let entryWidth = innerWidth;
    let entryHeight = coarse ? innerHeight + 'px' : '100%';
    host.style.height = entryHeight;
    function refreshHost() {
      if (document.fullscreenElement) {
        host.style.height = '100dvh';
        return;
      }
      if (coarse && innerWidth !== entryWidth) {
        entryWidth = innerWidth;
        entryHeight = innerHeight + 'px';
      }
      host.style.height = entryHeight;
    }
    document.addEventListener('fullscreenchange', refreshHost);
    window.addEventListener('resize', refreshHost);
    screen.orientation?.addEventListener('change', () => requestAnimationFrame(refreshHost));
    document.addEventListener('dblclick', event => event.preventDefault(), {passive:false});
    document.addEventListener('visibilitychange', () => {if(document.hidden)window.dispatchEvent(new Event('blur'));});
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
  </script>
  <script src="install.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
