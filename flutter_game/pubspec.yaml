name: guardian_new
description: A mobile hack and slash adventure built with Flutter and Bonfire.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  bonfire: 4.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets-fonts/OFL.txt
    - assets/art.json
    - assets/images/
  fonts:
    - family: Guardian
      fonts:
        - asset: assets-fonts/NanumGothic-Regular.ttf
