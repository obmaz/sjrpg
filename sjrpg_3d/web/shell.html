<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>자연의 수호자</title>
  $GODOT_HEAD_INCLUDE
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="install-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="자연의 수호자">
  <script src="fullscreen.js"></script>
  <script src="install.js"></script>
  <link rel="preload" href="loading-bg.webp" as="image">
  <style>
    :root { color-scheme: dark; --cream:#e7dfd0; --muted:#aaa298; --bronze:#a38660; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#080b10; }
    body { color:var(--cream); font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
    #canvas { position:fixed; inset:0; display:block; width:100%; height:100%; max-width:100%; max-height:100%; outline:none; touch-action:none; }
    #loading { position:fixed; inset:0; height:100vh; height:100dvh; isolation:isolate; overflow:auto;
      display:flex; align-items:safe flex-end; justify-content:center;
      padding:max(22px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(36px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left)); background:#080b10; }
    #loading::before { content:""; position:fixed; inset:0; z-index:-2; background:url("loading-bg.webp") center 38%/cover no-repeat; }
    #loading::after { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background:linear-gradient(180deg,#080b1008 10%,#080b1030 43%,#080b10c9 72%,#080b10fa),radial-gradient(ellipse at center,transparent 20%,#080b1060); }
    .loading-panel { width:min(100%,460px); text-align:center; text-shadow:0 2px 12px #000; padding-bottom:clamp(0px,3vh,28px); }
    .chapter { margin:0 0 10px; color:#b29a7b; font-size:12px; font-weight:600; letter-spacing:.16em; }
    h1 { margin:0; font-size:clamp(30px,7vw,43px); font-weight:700; letter-spacing:.035em; line-height:1.4; word-break:keep-all; }
    .rule { width:76px; height:1px; margin:18px auto 22px; background:linear-gradient(90deg,transparent,#a3866099,transparent); }
    .entry-action { height:82px; display:grid; align-items:center; }
    .progress-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; font-size:14px; line-height:1.5; }
    #phase { margin:0; text-align:left; }
    #amount { color:#cab395; white-space:nowrap; font-variant-numeric:tabular-nums; font-size:13px; }
    progress { display:block; appearance:none; -webkit-appearance:none; width:100%; height:4px; overflow:hidden; border:0; background:#161a20; box-shadow:0 0 0 1px #a3866040; }
    progress::-webkit-progress-bar { background:#161a20; }
    progress::-webkit-progress-value { background:linear-gradient(90deg,#66513e,#b3956d); }
    progress::-moz-progress-bar { background:linear-gradient(90deg,#66513e,#b3956d); }
    progress:indeterminate { background:linear-gradient(90deg,#161a20 10%,#a3866055 50%,#161a20 90%); background-size:200% 100%; animation:searching 2.4s ease-in-out infinite; }
    progress:indeterminate::-webkit-progress-bar { background:transparent; }
    @keyframes searching { 0%,100%{background-position:100% 0}50%{background-position:0 0} }
    #transfer { min-height:18px; margin:9px 0 0; color:var(--muted); font-size:11px; text-align:right; font-variant-numeric:tabular-nums; }
    #entry-start { width:100%; height:72px; border:1px solid #a38660; border-radius:3px; padding:0 24px;
      color:var(--cream); background:linear-gradient(#49372b,#291f1b); font:inherit; font-size:22px; font-weight:700; cursor:pointer; box-shadow:inset 0 1px #d5bb8d22,0 6px 22px #0007; }
    #entry-start:hover { background:linear-gradient(#574232,#35281f); }
    #entry-start:active { background:#211b18; }
    #entry-start:focus-visible,#retry:focus-visible,summary:focus-visible { outline:2px solid #dbc4a0; outline-offset:4px; }
    .hint { margin:14px 0 0; color:var(--muted); font-size:12px; line-height:1.7; word-break:keep-all; }
    #failure { text-align:left; margin-top:16px; }
    #failure p { margin:0; color:#ded4c6; font-size:14px; line-height:1.7; word-break:keep-all; }
    details { margin-top:12px; font-size:12px; color:var(--muted); line-height:1.6; }
    summary { cursor:pointer; padding:10px 0; }
    #error-detail { white-space:pre-wrap; overflow-wrap:anywhere; max-height:90px; overflow:auto; }
    #retry { width:100%; min-height:56px; margin-top:16px; border:1px solid #a38660; border-radius:3px; background:#30251e; color:var(--cream); font:inherit; font-size:16px; cursor:pointer; }
    [hidden] { display:none !important; }
    noscript { position:fixed; inset:0; z-index:5; padding:30vh 24px 24px; background:#080b10; text-align:center; line-height:1.8; }
    @media (orientation:landscape) {
      #loading { justify-content:flex-end; padding-bottom:max(24px,env(safe-area-inset-bottom)); }
      #loading::before { background-position:38% 38%; }
      #loading::after { background:linear-gradient(90deg,#080b1008 8%,#080b1040 38%,#080b10d9 68%,#080b10f5),linear-gradient(0deg,#080b1070,transparent 60%); }
      .loading-panel { width:min(44vw,460px); padding:0 0 4vh; margin-right:2vw; }
      h1 { font-size:clamp(27px,4vw,40px); }
    }
    @media (max-height:400px) and (orientation:landscape) {
      #loading { padding-top:14px; padding-bottom:max(16px,env(safe-area-inset-bottom)); }
      .loading-panel { padding-bottom:0; width:44vw; }
      .chapter { font-size:10px; margin-bottom:4px; }
      h1 { font-size:26px; }
      .rule { margin:10px auto 12px; }
      .hint { margin-top:8px; font-size:11px; }
      .entry-action { height:72px; }
      #entry-start { height:64px; font-size:20px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; } }
    #loading.reduce-motion progress { animation:none; }
  </style>
</head>
<body>
  <canvas id="canvas">이 브라우저는 게임 화면을 표시할 수 없습니다.</canvas>
  <section id="loading" aria-label="모험 불러오기">
    <div class="loading-panel">
      <p class="chapter">제1장 · 숲의 부름</p>
      <h1>자연의 수호자</h1>
      <div class="rule" aria-hidden="true"></div>
      <div class="entry-action">
        <div id="download">
          <div class="progress-heading"><p id="phase" role="status">숲으로 향하는 길을 여는 중</p><span id="amount"></span></div>
          <progress id="progress" aria-label="게임 다운로드"></progress>
          <p id="transfer"></p>
        </div>
        <button id="entry-start" type="button" hidden disabled>모험 시작</button>
      </div>
      <p class="hint" id="hint">네 개의 모험, 당신만의 수호자</p>
      <div id="failure" hidden>
        <p id="error-message" role="alert"></p>
        <details><summary>오류 자세히 보기</summary><div id="error-detail"></div></details>
        <button id="retry" type="button">다시 불러오기</button>
      </div>
    </div>
  </section>
  <noscript>모험을 시작하려면 브라우저에서 JavaScript를 허용해 주세요.</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    const GODOT_CONFIG = $GODOT_CONFIG;
    // Independent IDBFS database: do not mount the2D edition's/userfs snapshot.
    GODOT_CONFIG.persistentPaths = ['/userfs/sjrpg_3d'];
    const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
    (() => {
      const preview3D = true;
      window.__sjrpgLaunch3D = preview3D;
      const overlay = document.getElementById('loading');
      const phase = document.getElementById('phase');
      const progress = document.getElementById('progress');
      const amount = document.getElementById('amount');
      const transfer = document.getElementById('transfer');
      const start = document.getElementById('entry-start');
      let engineReady = false;
      let startAdventure = null;
      let entering = false;
      let settled = false;
      function showTitle() {
        if (!engineReady || !startAdventure) return;
        overlay.hidden = false;
        overlay.setAttribute('aria-label', '모험 시작');
        document.getElementById('download').hidden = true;
        start.hidden = false;
        start.disabled = false;
        entering = false;
        window.__sjrpgEntryReady = true;
      }
      // Keep the same DOM, backdrop and title through download, initialization and readiness.
      // Godot supplies a callback for the current title, including a return from selection/settings.
      window.__sjrpgEntry = {
        show(callback, reduceMotion = false) {
          startAdventure = callback;
          overlay.classList.toggle('reduce-motion', reduceMotion);
          showTitle();
        },
        hide() { overlay.hidden = true; startAdventure = null; window.__sjrpgEntryReady = false; }
      };
      start.addEventListener('click', () => {
        if (entering || !engineReady || !startAdventure) return;
        entering = true;
        start.disabled = true;
        document.getElementById('canvas').focus();
        startAdventure();
      });
      function setPhase(text) {
        if (phase.textContent !== text) phase.textContent = text;
      }
      document.getElementById('retry').addEventListener('click', () => window.location.reload());
      function fail(error, message = '게임을 불러오지 못했습니다. 연결을 확인하고 다시 시도해 주세요.') {
        if (settled) return;
        settled = true;
        console.error(error);
        setPhase('모험을 준비하지 못했습니다');
        progress.hidden = true;
        amount.textContent = '';
        transfer.hidden = true;
        document.getElementById('hint').hidden = true;
        document.getElementById('failure').hidden = false;
        document.getElementById('error-message').textContent = message;
        document.getElementById('error-detail').textContent = error instanceof Error ? error.message : String(error);
      }
      if (typeof Engine === 'undefined') {
        fail('The game engine could not be downloaded.');
        return;
      }
      try {
        let destination = null;
        GODOT_CONFIG.onExit = code => {
          // Godot finishes its asynchronous IDBFS sync before this callback.
          if (destination && code === 0) location.assign(destination);
          else if (destination) fail(new Error(`저장 후 종료에 실패했습니다 (${code})`));
        };
        const engine = new Engine(GODOT_CONFIG);
        window.__sjrpgStorageMounts = GODOT_CONFIG.persistentPaths || ['/userfs'];
        window.__sjrpgNavigateEdition = (edition, prepared = false) => {
          if (edition !== '' || destination) return false;
          destination = new URL('../', location.href).href;
          if (!prepared) engine.requestQuit();
          return true;
        };
        const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
        if (missing.length) {
          // Keep Godot's optional service-worker recovery for exports that enable it.
          if (GODOT_CONFIG.serviceWorker && GODOT_CONFIG.ensureCrossOriginIsolationHeaders && 'serviceWorker' in navigator) {
            setPhase('브라우저 실행 환경을 준비하는 중');
            Promise.race([
              Promise.resolve().then(() => navigator.serviceWorker.getRegistration()).then(registration => {
                if (registration) throw new Error('Service worker already exists.');
                return engine.installServiceWorker();
              }),
              new Promise(resolve => setTimeout(resolve, 2000))
            ]).then(() => window.location.reload()).catch(error => fail(error));
          } else {
            fail(missing.join('\n'), '이 브라우저에서는 게임을 실행할 수 없습니다. 최신 Chrome 또는 Safari에서 다시 열어 주세요.');
          }
          return;
        }
        engine.startGame({
          onProgress(current, total) {
            if (settled) return;
            if (current > 0 && total > 0) {
              progress.max = total;
              progress.value = current;
              amount.textContent = `${Math.floor(Math.min(current / total, 1) * 100)}%`;
              transfer.textContent = `${(current / 1048576).toFixed(1)} / ${(total / 1048576).toFixed(1)} MB`;
              setPhase(current >= total ? '다운로드 완료 · 모험을 준비하는 중' : '모험을 불러오는 중');
            } else {
              progress.removeAttribute('value');
              progress.removeAttribute('max');
              amount.textContent = '';
              transfer.textContent = '';
              setPhase('숲으로 향하는 길을 여는 중');
            }
          }
        }).then(() => {
          if (settled) return;
          settled = true;
          engineReady = true;
          showTitle();
        }, error => fail(error));
      } catch (error) { fail(error); }
    })();
  </script>
</body>
</html>
