name: Check 3D optimization budgets
on:
    push:
        paths:
            - ".github/workflows/perf-candidate-tests.yml"
            - "sjrpg_3d/scripts/hud.gd"
            - "sjrpg_3d/scripts/touch_controls.gd"
            - "sjrpg_3d/tests/cases/hud_draw_cache.gd"
            - "sjrpg_3d/tests/cases/native_card_geometry_cache.gd"
            - "sjrpg_3d/scripts/minimap.gd"
            - "sjrpg_3d/tests/cases/minimap_mesh_cache.gd"
            - "sjrpg_3d/scripts/iso_sprite.gd"
            - "sjrpg_3d/scripts/canopy_shade.gd"
            - "sjrpg_3d/scripts/plaza_water.gd"
            - "sjrpg_3d/scripts/ortho_3d_affordances.gd"
            - "sjrpg_3d/tests/cases/iso_sprite_lazy.gd"
            - "sjrpg_3d/web/canvas-budget.js"
            - "sjrpg_3d/web/check_canvas_budget.mjs"
            - "sjrpg_3d/scripts/actor_atlas.gd"
            - "sjrpg_3d/scripts/actor_sprite.gd"
            - "sjrpg_3d/scripts/native_enemy_models.gd"
            - "sjrpg_3d/scripts/ortho_3d_preview.gd"
            - "sjrpg_3d/scripts/class_select.gd"
            - "sjrpg_3d/scripts/gamepad_input.gd"
            - "sjrpg_3d/tests/cases/gamepad_reconnect_epoch.gd"
            - "sjrpg_3d/tests/cases/*budget*.gd"
            - "sjrpg_3d/tests/run_all.gd"
            - "sjrpg_3d/tests/cases/render_quality.gd"
            - "sjrpg_3d/tests/cases/actor_atlas_lazy.gd"
            - "sjrpg_3d/tests/cases/native_enemy_recipe_cache.gd"
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: perf-candidate-${{ github.sha }}
    cancel-in-progress: false
jobs:
    regression:
        runs-on: ubuntu-latest
        timeout-minutes: 12
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - name: Check the mobile compositor budget
              run: node sjrpg_3d/web/check_canvas_budget.mjs
            - name: Measure a truly cold model cache and verify immutable instances
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
                  tools/check.sh --project=3d --only=native_enemy_recipe_cache
            - name: Check cold scenery texture consumption
              run: tools/check.sh --project=3d --only=iso_sprite_lazy
            - name: Check lazy textures, UI idle work, rendering and gameplay
              run: |
                  tools/check.sh --project=3d --only=hud_draw_cache,native_card_geometry_cache,native_projectile_fx,hud_header,hud_layout,cooldowns,fullscreen_settings,juice,juice_player,juice_enemy,ui_tone,reference_fx,minimap_mesh_cache,minimap_border,render_budget,iso_sprite_lazy,canopy_shade,plaza_animation,native_environment,native_town_props,ortho_3d_forest_trees,art_projection,axis,npc_clearance,actor_atlas_lazy,entry_probe_budget,native_render_budget,render_quality,native_enemy_models,native_enemy_scale,native_enemy_radius,corpses,melee_elevation,spatial_combat,world_zoom,entry_layout,gamepad_reconnect_epoch,gamepad_gameplay,ui_input
