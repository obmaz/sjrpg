name: Check 3D optimization budgets
# 자동 검증은 web.yml의 tools/ci.sh가 담당한다. 이 작업은 필요할 때 수동 실행한다.
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: perf-candidate-${{ github.sha }}
    cancel-in-progress: false
jobs:
    regression:
        runs-on: ubuntu-latest
        timeout-minutes: 12
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - name: Check the mobile compositor budget
              run: node sjrpg_3d/web/check_canvas_budget.mjs
            - name: Measure a truly cold model cache and verify immutable instances
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
                  tools/check.sh --project=3d --only=native_enemy_recipe_cache
            - name: Check cold scenery texture consumption
              run: tools/check.sh --project=3d --only=iso_sprite_lazy
            - name: Check lazy textures, UI idle work, rendering and gameplay
              run: |
                  tools/check.sh --project=3d --only=music,hud_draw_cache,touch_draw_layers,minimap_retained,native_card_geometry_cache,native_projectile_fx,hud_header,hud_layout,cooldowns,fullscreen_settings,juice,juice_player,juice_enemy,ui_tone,reference_fx,minimap_mesh_cache,minimap_border,render_budget,iso_sprite_lazy,canopy_shade,plaza_animation,native_environment,native_town_props,forest_tree_renderer_3d,art_projection,axis,npc_clearance,actor_atlas_lazy,entry_probe_budget,native_render_budget,render_quality,native_enemy_models,native_enemy_scale,native_enemy_radius,corpses,melee_elevation,spatial_combat,world_zoom,entry_layout,gamepad_reconnect_epoch,gamepad_gameplay,ui_input
