name: Review actual native sizing and zoom
on:
    push:
        paths:
            - ".github/workflows/native-scale-review.yml"
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: native-scale-review-${{ github.sha }}
    cancel-in-progress: false
jobs:
    actual:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                edition: [before, after]
        env:
            SJRPG_SCALE_EDITION: ${{ matrix.edition }}
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install actual browser
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Install pinned engine
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
            - name: Export actual candidate
              if: matrix.edition == 'after'
              run: sjrpg_3d/tools/export_web.sh
            - name: Export unchanged real baseline with review instrumentation only
              if: matrix.edition == 'before'
              run: |
                  git fetch --depth=1 origin 11c261e0d60bea7fa0719e43923a5f013164708f
                  mkdir -p build/native-scale-baseline
                  git archive 11c261e0d60bea7fa0719e43923a5f013164708f | tar -x -C build/native-scale-baseline
                  cp sjrpg_3d/scripts/native_scale_review.gd build/native-scale-baseline/sjrpg_3d/scripts/
                  python3 - <<'PY'
                  from pathlib import Path
                  main = Path("build/native-scale-baseline/sjrpg_3d/scripts/main.gd")
                  text = main.read_text()
                  hook = '\tif OS.has_feature("web") and str(JavaScriptBridge.eval("new URLSearchParams(window.location.search).get(\'scale_review\')", true)) == "1":\n\t\tadd_child(preload("res://scripts/native_scale_review.gd").new().setup(self))\n'
                  assert "func _ready() -> void:\n" in text
                  main.write_text(text.replace("func _ready() -> void:\n", "func _ready() -> void:\n" + hook, 1))
                  PY
                  chmod +x build/native-scale-baseline/sjrpg_3d/tools/*.sh
                  build/native-scale-baseline/sjrpg_3d/tools/export_web.sh
            - name: Exercise actual GUI, sources, native meshes and physics
              run: |
                  mkdir -p "build/native-scale-review/$SJRPG_SCALE_EDITION"
                  if test "$SJRPG_SCALE_EDITION" = before; then
                      SJRPG_SCALE_WEB=build/native-scale-baseline/sjrpg_3d/build/web
                      export SJRPG_SCALE_BASELINE=1
                  else
                      SJRPG_SCALE_WEB=sjrpg_3d/build/web
                  fi
                  python3 -m http.server 8784 --bind 127.0.0.1 --directory "$SJRPG_SCALE_WEB" > "build/native-scale-review/$SJRPG_SCALE_EDITION/server.log" 2>&1 &
                  SJRPG_SCALE_SERVER_PID=$!
                  trap 'kill "$SJRPG_SCALE_SERVER_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8784/ > /dev/null
                  node sjrpg_3d/tools/check_native_scale.mjs http://127.0.0.1:8784/ "build/native-scale-review/$SJRPG_SCALE_EDITION"
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: native-scale-${{ matrix.edition }}
                  path: build/native-scale-review/${{ matrix.edition }}
                  if-no-files-found: ignore
                  retention-days: 7
    compare:
        if: always()
        needs: actual
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - uses: actions/download-artifact@v4
              with:
                  name: native-scale-before
                  path: build/native-scale-review/before
            - uses: actions/download-artifact@v4
              with:
                  name: native-scale-after
                  path: build/native-scale-review/after
            - name: Check actual before and after measurements
              run: node sjrpg_3d/tools/compare_native_scale.mjs build/native-scale-review
            - name: Compose actual comparable screenshots
              if: always()
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
                  node sjrpg_3d/tools/compare_native_style.mjs build/native-scale-review
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: native-scale-comparison
                  path: build/native-scale-review
                  if-no-files-found: ignore
                  retention-days: 7
