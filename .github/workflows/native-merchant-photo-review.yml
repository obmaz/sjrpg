name: Photograph visible imported merchant in town
on:
    push:
        paths:
            - ".github/workflows/native-merchant-photo-review.yml"
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: native-merchant-photo-review-${{ github.sha }}
    cancel-in-progress: false
jobs:
    actual:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                edition: [before, after]
        env:
            SJRPG_MERCHANT_EDITION: ${{ matrix.edition }}
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install actual browser
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Install pinned engine
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
            - name: Export actual candidate
              if: matrix.edition == 'after'
              run: sjrpg_3d/tools/export_web.sh
            - name: Export unchanged real baseline with review instrumentation only
              if: matrix.edition == 'before'
              run: |
                  git fetch --depth=1 origin e2b2d3a7ebf8f84039bb75c06c2e04496797e85c
                  mkdir -p build/native-merchant-baseline
                  git archive e2b2d3a7ebf8f84039bb75c06c2e04496797e85c | tar -x -C build/native-merchant-baseline
                  for SJRPG_OBSERVER in native_style_review.gd native_model_gallery.gd native_actor_proportion_audit.gd; do
                      cp "sjrpg_3d/scripts/$SJRPG_OBSERVER" build/native-merchant-baseline/sjrpg_3d/scripts/
                  done
                  chmod +x build/native-merchant-baseline/sjrpg_3d/tools/*.sh
                  build/native-merchant-baseline/sjrpg_3d/tools/export_web.sh
            - name: Exercise actual GUI, sources, native meshes and physics
              run: |
                  mkdir -p "build/native-merchant-photo-review/$SJRPG_MERCHANT_EDITION"
                  if test "$SJRPG_MERCHANT_EDITION" = before; then
                      SJRPG_MERCHANT_WEB=build/native-merchant-baseline/sjrpg_3d/build/web
                      export SJRPG_STYLE_BASELINE=1
                  else
                      SJRPG_MERCHANT_WEB=sjrpg_3d/build/web
                  fi
                  python3 -m http.server 8784 --bind 127.0.0.1 --directory "$SJRPG_MERCHANT_WEB" > "build/native-merchant-photo-review/$SJRPG_MERCHANT_EDITION/server.log" 2>&1 &
                  SJRPG_MERCHANT_SERVER_PID=$!
                  trap 'kill "$SJRPG_MERCHANT_SERVER_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8784/ > /dev/null
                  SJRPG_STYLE_MERCHANT_ONLY=1 SJRPG_MERCHANT_PHOTO_ONLY=1 node sjrpg_3d/tools/check_native_style.mjs http://127.0.0.1:8784/ "build/native-merchant-photo-review/$SJRPG_MERCHANT_EDITION"
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: native-merchant-photo-${{ matrix.edition }}
                  path: build/native-merchant-photo-review/${{ matrix.edition }}
                  if-no-files-found: ignore
                  retention-days: 7
    compare:
        if: always()
        needs: actual
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - uses: actions/download-artifact@v4
              with:
                  name: native-merchant-photo-before
                  path: build/native-merchant-photo-review/before
            - uses: actions/download-artifact@v4
              with:
                  name: native-merchant-photo-after
                  path: build/native-merchant-photo-review/after
            - name: Check actual before and after measurements
              run: node sjrpg_3d/tools/compare_native_merchant.mjs build/native-merchant-photo-review
            - name: Compose actual comparable screenshots
              if: always()
              env:
                  SJRPG_STYLE_BEFORE_LABEL: e2b2d3a
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
                  node sjrpg_3d/tools/compare_native_style.mjs build/native-merchant-photo-review
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: native-merchant-photo-comparison
                  path: build/native-merchant-photo-review
                  if-no-files-found: ignore
                  retention-days: 7
