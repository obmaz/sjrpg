name: Prepare exact CC0 Mira candidate
on:
    push:
        paths:
            - ".github/workflows/import-cc0-resident.yml"
            - "sjrpg_3d/tools/hero_art/fetch_resident_sources.py"
            - "sjrpg_3d/tools/hero_art/export_cc0_resident.py"
            - "sjrpg_3d/tools/hero_art/publish_resident_blobs.py"
            - "sjrpg_3d/tools/hero_art/resident-source-plan.json"
    workflow_dispatch:
permissions:
    contents: write
concurrency:
    group: cc0-resident-import-${{ github.sha }}
    cancel-in-progress: true
jobs:
    prepare:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            SJRPG_CHARACTER_SOURCE_DIR: /tmp/sjrpg-cc0-merchant-source
            SJRPG_CC0_RESIDENT_OUT: ${{ github.workspace }}/build/cc0-resident
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Syntax check exact-source candidate tools
              run: python3 -m py_compile sjrpg_3d/tools/hero_art/fetch_resident_sources.py sjrpg_3d/tools/hero_art/export_cc0_resident.py sjrpg_3d/tools/hero_art/publish_resident_blobs.py
            - name: Install offline model converter
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y blender python3-numpy
                  blender --version
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - uses: actions/cache/restore@v4
              with:
                  path: /tmp/sjrpg-cc0-merchant-source
                  key: cc0-character-sources-${{ hashFiles('sjrpg_3d/tools/hero_art/source-provenance.json') }}-${{ github.run_id }}
                  restore-keys: |
                      cc0-character-sources-${{ hashFiles('sjrpg_3d/tools/hero_art/source-provenance.json') }}-
            - name: Preserve and verify the existing merchant and mage sources
              run: python3 sjrpg_3d/tools/hero_art/fetch_sources.py
            - name: Acquire the reviewed female Ranger and matching female head under exact CC0 licenses
              run: python3 sjrpg_3d/tools/hero_art/fetch_resident_sources.py
            - name: Build grounded female actor with actual rest-aware animation and strict mobile budgets
              run: blender --background --python-exit-code 1 --python sjrpg_3d/tools/hero_art/export_cc0_resident.py
            - name: Import with the pinned engine and publish candidate blobs without moving refs
              env:
                  SJRPG_ASSET_TOKEN: ${{ github.token }}
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
                  python3 sjrpg_3d/tools/hero_art/publish_resident_blobs.py
            - uses: actions/cache/save@v4
              if: always()
              with:
                  path: /tmp/sjrpg-cc0-merchant-source
                  key: cc0-character-sources-${{ hashFiles('sjrpg_3d/tools/hero_art/source-provenance.json') }}-${{ github.run_id }}
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: cc0-mira-candidate
                  path: |
                      build/cc0-resident/mira.glb
                      build/cc0-resident/provenance.json
                      build/cc0-resident/LICENSE-*.txt
                      build/cc0-resident/resident-source-provenance.json
                      build/cc0-resident/published-blobs.json
                      build/cc0-resident/godot-import/assets/art/native_residents
                  if-no-files-found: ignore
                  retention-days: 7
