name: Check and deploy

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run check

    deploy:
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: github-pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/configure-pages@v6.0.0
            - name: Prepare static game files
              run: |
                  mkdir _site
                  cp index.html style.css playful-pixels.mp3 _site/
                  cp -R src _site/src
                  touch _site/.nojekyll
            - uses: actions/upload-pages-artifact@v5.0.0
              with:
                  path: _site
                  include-hidden-files: true
            - uses: actions/deploy-pages@v5.0.1
              id: deployment
