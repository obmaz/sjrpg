name: Check and deploy

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - name: Install Flutter 3.47.8
              run: |
                  git clone --depth 1 --branch 3.47.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/guardian-flutter"
                  echo "$RUNNER_TEMP/guardian-flutter/bin" >> "$GITHUB_PATH"
                  "$RUNNER_TEMP/guardian-flutter/bin/flutter" config --no-analytics
            - run: npm run prepare:new
            - run: flutter pub get --enforce-lockfile
              working-directory: flutter_game
            - run: dart format --output=none --set-exit-if-changed lib test
              working-directory: flutter_game
            - run: flutter analyze
              working-directory: flutter_game
            - run: flutter test
              working-directory: flutter_game
            - run: flutter build web --release --base-href /sjrpg/new/ --no-web-resources-cdn
              working-directory: flutter_game
            - run: npm run check
            - run: npm run build
            - uses: actions/upload-pages-artifact@v5.0.0
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              with:
                  path: dist
                  include-hidden-files: true

    deploy:
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: github-pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/configure-pages@v6.0.0
            - uses: actions/deploy-pages@v5.0.1
              id: deployment
