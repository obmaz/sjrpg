name: Build web and deploy to GitHub Pages

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        # Explicit UI review commits run the focused harness without publishing.
        if: "!contains(github.event.head_commit.message, '[layout-review]')"
        runs-on: ubuntu-latest
        outputs:
            native_style_release_allowed: ${{ steps.native_release.outputs.allowed }}
        steps:
            - uses: actions/checkout@v7.0.1

            - name: Read native visual review release state
              id: native_release
              run: |
                  if test -f .native-style-review-hold; then
                      echo 'allowed=false' >> "$GITHUB_OUTPUT"
                  else
                      echo 'allowed=true' >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Install test and portal browser dependencies
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium

            - name: Cache Godot and web export templates
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1

            - name: Check (import, tests) and export web build
              id: native_build
              run: |
                  chmod +x tools/*.sh
                  tools/setup_godot.sh
                  python3 sjrpg_2d/tools/test_stamp_web.py
                  python3 sjrpg_3d/tools/test_stamp_web.py
                  node tools/test_portal.mjs
                  node sjrpg_2d/web/check_shell.mjs
                  node sjrpg_3d/web/check_shell.mjs
                  node sjrpg_3d/web/check_install.mjs
                  node sjrpg_3d/web/check_fullscreen.mjs
                  node sjrpg_3d/web/check_orientation.mjs
                  node sjrpg_3d/web/check_back.mjs
                  node sjrpg_3d/web/check_canvas_budget.mjs
                  node sjrpg_3d/tools/check_music_memory.mjs --self-test
                  tools/check.sh --export
                  touch build/web/.nojekyll

            - name: Upload the exact exported browser build
              uses: actions/upload-artifact@v6
              with:
                  name: exported-web-build
                  path: build/web
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

            - uses: actions/upload-pages-artifact@v5.0.0
              with:
                  path: build/web
                  include-hidden-files: true

    browser_review:
        needs: build
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                review: [native, save, loading, gamepad, music, equipment]
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Download the exact checked export from this workflow
              uses: actions/download-artifact@v6
              with:
                  name: exported-web-build
                  path: build/web
            - name: Install browser test dependency
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - name: Review the exported game
              env:
                  SJRPG_BROWSER_REVIEW: ${{ matrix.review }}
              run: |
                  set -euo pipefail
                  if [[ "$SJRPG_BROWSER_REVIEW" == native ]]; then
                      chmod +x tools/check_native_web.sh
                      tools/check_native_web.sh
                      exit 0
                  fi
                  case "$SJRPG_BROWSER_REVIEW" in
                      save) SJRPG_CHECKER=check_save_layout.mjs ;;
                      loading) SJRPG_CHECKER=check_entry_loading.mjs ;;
                      gamepad) SJRPG_CHECKER=check_gamepad.mjs ;;
                      music) SJRPG_CHECKER=check_music_memory.mjs; export SJRPG_MUSIC_PROFILE=fold ;;
                      equipment) SJRPG_CHECKER=check_equipment_layout.mjs ;;
                      *) echo "Unknown browser review: $SJRPG_BROWSER_REVIEW" >&2; exit 2 ;;
                  esac
                  SJRPG_REVIEW_DIR="build/review/$SJRPG_BROWSER_REVIEW"
                  mkdir -p "$SJRPG_REVIEW_DIR"
                  python3 -m http.server 8779 --bind 127.0.0.1 --directory build/web/3d > "$SJRPG_REVIEW_DIR/server.log" 2>&1 &
                  SJRPG_REVIEW_SERVER_PID=$!
                  trap 'kill "$SJRPG_REVIEW_SERVER_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8779/ > /dev/null
                  node "sjrpg_3d/tools/$SJRPG_CHECKER" http://127.0.0.1:8779/ "$SJRPG_REVIEW_DIR"
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: native3d-browser-review-${{ matrix.review }}
                  path: build/review
                  if-no-files-found: ignore
                  retention-days: 7

    deploy:
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.native_style_release_allowed == 'true'
        needs: [build, browser_review]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: github-pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/configure-pages@v6.0.0
              with:
                  enablement: true
            - uses: actions/deploy-pages@v5.0.1
              id: deployment

            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Verify the published game in a fresh browser
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
                  mkdir -p build/published-review
                  curl --fail --silent --show-error --max-time 10 --retry 8 --retry-delay 2 https://obmaz.github.io/sjrpg/ > build/published-review/chooser.html
                  SJRPG_STYLE_SMOKE=1 node sjrpg_3d/tools/check_native_style.mjs "https://obmaz.github.io/sjrpg/3d/?v=${{ github.sha }}" build/published-review
                  SJRPG_MUSIC_PROFILE=fold node sjrpg_3d/tools/check_music_memory.mjs "https://obmaz.github.io/sjrpg/3d/?v=${{ github.sha }}" build/published-review/music
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: published-native3d-review
                  path: build/published-review
                  if-no-files-found: ignore
                  retention-days: 7
