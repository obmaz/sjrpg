name: Build web and deploy to GitHub Pages

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

env:
    GODOT_VERSION: 4.5.1

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1

            - name: Cache Godot and web export templates
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ env.GODOT_VERSION }}-tools-v1

            - name: Check (import, tests) and export web build
              run: |
                  chmod +x tools/*.sh
                  tools/setup_godot.sh
                  tools/check.sh --export
                  touch build/web/.nojekyll

            - uses: actions/upload-pages-artifact@v5.0.0
              with:
                  path: build/web
                  include-hidden-files: true

    deploy:
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: github-pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/configure-pages@v6.0.0
              with:
                  enablement: true
            - uses: actions/deploy-pages@v5.0.1
              id: deployment
