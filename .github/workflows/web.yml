name: CI

on:
    push:
        branches: [main]
        paths:
            - ".github/**"
            - "tools/**"
            - "sjrpg_3d/**"
            - "!sjrpg_3d/**.md"
            - "web/**"
            - ".godot-version"
            - "package.json"
            - "package-lock.json"
    pull_request:
        paths:
            - ".github/**"
            - "tools/**"
            - "sjrpg_3d/**"
            - "!sjrpg_3d/**.md"
            - "web/**"
            - ".godot-version"
            - "package.json"
            - "package-lock.json"
    workflow_dispatch:
        inputs:
            browser_review:
                description: "무거운 실제 브라우저 검수 6종도 실행"
                type: boolean
                default: false
            publish:
                description: "명시적으로 요청한 GitHub Pages 웹 배포"
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.publish == true && 'publish' || 'check' }}
    cancel-in-progress: ${{ inputs.publish != true }}

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        outputs:
            native_style_release_allowed: ${{ steps.native_release.outputs.allowed }}
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'
            - name: Install workflow policy parser
              run: python3 -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
            - name: Read native visual review release state
              id: native_release
              run: |
                  if test -f .native-style-review-hold; then
                      echo 'allowed=false' >> "$GITHUB_OUTPUT"
                  else
                      echo 'allowed=true' >> "$GITHUB_OUTPUT"
                  fi
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Prepare the same local development tools
              run: tools/setup_env.sh --project=3d --templates web --skip-import
            - name: Run the shared local and CI checks
              env:
                  SJRPG_PUBLISH_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
              run: |
                  if [[ "$SJRPG_PUBLISH_BUILD" == true ]]; then
                      tools/ci.sh --all-editions
                  else
                      tools/ci.sh
                  fi
            - uses: actions/upload-artifact@v6
              with:
                  name: exported-web-build
                  path: build/ci/web
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7
            - uses: actions/upload-pages-artifact@v5.0.0
              if: github.event_name == 'workflow_dispatch' && inputs.publish == true
              with:
                  path: build/ci/web
                  include-hidden-files: true

    browser_review:
        if: github.event_name == 'workflow_dispatch' && (inputs.browser_review == true || inputs.publish == true)
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                review: [native, save, loading, gamepad, music, equipment]
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - uses: actions/download-artifact@v6
              with:
                  name: exported-web-build
                  path: build/ci/web
            - name: Install browser test dependency
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - name: Run the same local browser checker
              env:
                  SJRPG_BROWSER_REVIEW: ${{ matrix.review }}
              run: tools/check_browser_review.sh "$SJRPG_BROWSER_REVIEW"
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: native3d-browser-review-${{ matrix.review }}
                  path: build/review
                  if-no-files-found: ignore
                  retention-days: 7

    deploy:
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.build.outputs.native_style_release_allowed == 'true'
        needs: [build, browser_review]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: github-pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/configure-pages@v6.0.0
              with:
                  enablement: true
            - uses: actions/deploy-pages@v5.0.1
              id: deployment
              with:
                  # File sync and activation exceeded the default 10-minute limit.
                  timeout: 1200000

            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Verify the published game in a fresh browser
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
                  mkdir -p build/published-review
                  curl --fail --silent --show-error --max-time 10 --retry 8 --retry-delay 2 https://obmaz.github.io/sjrpg/ > build/published-review/chooser.html
                  SJRPG_STYLE_SMOKE=1 node sjrpg_3d/tools/check_native_style.mjs "https://obmaz.github.io/sjrpg/3d/?v=${{ github.sha }}" build/published-review
                  SJRPG_MUSIC_PROFILE=fold node sjrpg_3d/tools/check_music_memory.mjs "https://obmaz.github.io/sjrpg/3d/?v=${{ github.sha }}" build/published-review/music
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: published-native3d-review
                  path: build/published-review
                  if-no-files-found: ignore
                  retention-days: 7
