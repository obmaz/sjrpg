name: Build web and deploy to GitHub Pages

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

env:
    GODOT_VERSION: 4.5.1

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1

            - name: Cache Godot and web export templates
              id: godot-cache
              uses: actions/cache@v4
              with:
                  path: |
                      ~/godot
                      ~/.local/share/godot/export_templates
                  key: godot-${{ env.GODOT_VERSION }}-web-v1

            - name: Install Godot ${{ env.GODOT_VERSION }}
              if: steps.godot-cache.outputs.cache-hit != 'true'
              run: |
                  set -euo pipefail
                  base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
                  mkdir -p ~/godot
                  curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
                  unzip -q /tmp/godot.zip -d ~/godot
                  mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
                  curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
                  unzip -q /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d /tmp
                  dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
                  mkdir -p "$dest"
                  mv /tmp/templates/* "$dest/"

            - name: Import project
              run: ~/godot/godot --headless --import 2>&1 | tee import.log

            - name: Fail on script errors
              run: |
                  if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then exit 1; fi

            - name: Skill smoke test (casts every skill headless)
              run: |
                  ~/godot/godot --headless res://tests/skill_smoke.tscn 2>&1 | tee smoke.log
                  grep -q "SMOKE DONE failures=0" smoke.log
                  if grep -E "SCRIPT ERROR" smoke.log; then exit 1; fi

            - name: Export web build
              run: |
                  mkdir -p build/web
                  ~/godot/godot --headless --export-release "Web" build/web/index.html 2>&1 | tee export.log
                  test -s build/web/index.wasm
                  test -s build/web/index.pck
                  touch build/web/.nojekyll

            - uses: actions/upload-pages-artifact@v5.0.0
              with:
                  path: build/web
                  include-hidden-files: true

    deploy:
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: github-pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/configure-pages@v6.0.0
              with:
                  enablement: true
            - uses: actions/deploy-pages@v5.0.1
              id: deployment
