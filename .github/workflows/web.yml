name: Build web and deploy to GitHub Pages

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        # Explicit UI review commits run the focused harness without publishing.
        if: "!contains(github.event.head_commit.message, '[layout-review]')"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Install browser test dependency
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium

            - name: Cache Godot and web export templates
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1

            - name: Check (import, tests) and export web build
              run: |
                  chmod +x tools/*.sh
                  tools/setup_godot.sh
                  python3 sjrpg_2d/tools/test_stamp_web.py
                  python3 sjrpg_3d/tools/test_stamp_web.py
                  node tools/test_portal.mjs
                  node sjrpg_2d/web/check_shell.mjs
                  node sjrpg_3d/web/check_shell.mjs
                  node sjrpg_3d/web/check_install.mjs
                  node sjrpg_3d/web/check_fullscreen.mjs
                  tools/check.sh --export
                  tools/check_native_web.sh
                  touch build/web/.nojekyll

            - name: Check the actual exported save selection UI
              run: |
                  mkdir -p build/review/save-layout
                  python3 -m http.server 8779 --bind 127.0.0.1 --directory build/web/3d > build/review/save-layout/server.log 2>&1 &
                  SJRPG_SAVE_SERVER_PID=$!
                  trap 'kill "$SJRPG_SAVE_SERVER_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8779/ > /dev/null
                  node sjrpg_3d/tools/check_save_layout.mjs http://127.0.0.1:8779/ build/review/save-layout

            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: native3d-browser-review
                  path: build/review
                  if-no-files-found: ignore
                  retention-days: 7

            - uses: actions/upload-pages-artifact@v5.0.0
              with:
                  path: build/web
                  include-hidden-files: true

    deploy:
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: github-pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/configure-pages@v6.0.0
              with:
                  enablement: true
            - uses: actions/deploy-pages@v5.0.1
              id: deployment
