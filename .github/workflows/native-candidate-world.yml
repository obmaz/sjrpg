name: Native candidate world review
# Review authored landmark roles against the unchanged village entry order.
on:
    push:
        paths:
            - ".github/workflows/native-candidate-world.yml"
    workflow_dispatch:
permissions:
    contents: read
    actions: read
concurrency:
    group: native-candidate-world-${{ github.sha }}
    cancel-in-progress: false
jobs:
    candidate_world:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install actual browser
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Import and export the actual candidate
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
                  sjrpg_3d/tools/export_web.sh
            - name: Run candidate_world through the actual main scene
              run: |
                  mkdir -p build/native-candidate/candidate_world
                  python3 -m http.server 8783 --bind 127.0.0.1 --directory sjrpg_3d/build/web > build/native-candidate/candidate_world/server.log 2>&1 &
                  SJRPG_CANDIDATE_SERVER_PID=$!
                  trap 'kill "$SJRPG_CANDIDATE_SERVER_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8783/ > /dev/null
                  SJRPG_STYLE_WORLD_ONLY=1 node sjrpg_3d/tools/check_native_style.mjs http://127.0.0.1:8783/ build/native-candidate/candidate_world/after
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: native-candidate-candidate_world
                  path: build/native-candidate/candidate_world
                  if-no-files-found: ignore
                  retention-days: 7
