name: Compose verified native scale comparisons
on:
    push:
        paths:
            - ".github/workflows/native-scale-compose.yml"
    workflow_dispatch:
permissions:
    contents: read
    actions: read
concurrency:
    group: native-scale-compose-${{ github.sha }}
    cancel-in-progress: false
jobs:
    compose:
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - uses: actions/download-artifact@v4
              with:
                  github-token: ${{ github.token }}
                  run-id: 42353384051
                  name: native-scale-before
                  path: build/native-scale-review/before
            - uses: actions/download-artifact@v4
              with:
                  github-token: ${{ github.token }}
                  run-id: 42353384051
                  name: native-scale-after
                  path: build/native-scale-review/after
            - name: Recheck genuine completed before and after measurements
              run: node sjrpg_3d/tools/compare_native_scale.mjs build/native-scale-review
            - name: Compose actual images with the correct baseline provenance
              env:
                  SJRPG_STYLE_BEFORE_LABEL: 11c261e
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
                  node sjrpg_3d/tools/compare_native_style.mjs build/native-scale-review
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: native-scale-verified-comparison
                  path: build/native-scale-review
                  if-no-files-found: ignore
                  retention-days: 7
