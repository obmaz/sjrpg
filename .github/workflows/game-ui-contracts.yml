name: Check game Back and FPS controls
on:
  push:
    paths:
      - "sjrpg_3d/scripts/main.gd"
      - "sjrpg_3d/scripts/fps_counter.gd"
      - "sjrpg_3d/tests/cases/system_back.gd"
      - "sjrpg_3d/tests/cases/fps_settings.gd"
      - "sjrpg_3d/web/check_back.mjs"
      - "sjrpg_3d/tools/screenshot.mjs"
      - ".github/workflows/game-ui-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.godot-tools
            ~/.local/share/godot/export_templates
          key: godot-${{ hashFiles('.godot-version') }}-tools-v1
      - name: Focused engine and browser checks
        run: |
          tools/setup_godot.sh
          sjrpg_3d/tools/check.sh --only=system_back,fps_settings,hud_layout,fullscreen_settings,screen_orientation,ui_tone
          sjrpg_3d/tools/export_web.sh
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node sjrpg_3d/web/check_back.mjs
          node sjrpg_3d/web/check_fullscreen.mjs
          node sjrpg_3d/web/check_orientation.mjs
      - name: Real game repeated browser Back
        run: |
          set -euo pipefail
          mkdir -p build/game-ui-review
          python3 -m http.server 8779 --bind 127.0.0.1 --directory sjrpg_3d/build/web >build/game-ui-review/server.log 2>&1 &
          SJRPG_BACK_SERVER=$!
          trap 'kill "$SJRPG_BACK_SERVER" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8779/ >/dev/null
          node sjrpg_3d/tools/screenshot.mjs --url http://127.0.0.1:8779/ --scene town --device phone --viewport 390x844 --dpr 1 --class mage --system-back 1 --settle 1000 --out build/game-ui-review/back-settings.png
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: game-back-fps-review
          path: build/game-ui-review
          retention-days: 7
