name: Review rendered frame pacing
on:
  push:
    paths:
      - ".github/workflows/frame-pacing-review.yml"
      - "sjrpg_3d/tools/check_frame_pacing.mjs"
      - "sjrpg_3d/tools/perf/frame_pacing_observer.gd"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.godot-tools
            ~/.local/share/godot/export_templates
          key: godot-${{ hashFiles('.godot-version') }}-tools-v1
      - name: Verify native movement, poses and combat feedback
        run: |
          tools/setup_godot.sh
          sjrpg_3d/tools/check.sh --only=native_animation_sampling,native_floor_query_budget,native_threshold_support,ortho_3d_motion,native_merchant,native_mira,native_warrior,native_enemy_models,native_enemy_recipe_cache,native_actor_materials,native_render_budget,hit_flash,town_gate_closure,gates
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SJRPG_PACING_PROFILES: high-keys,high-touch
      SJRPG_PACING_FRAMES: "120"
      SJRPG_PACING_DEADLINE_MS: "300000"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.godot-tools
            ~/.local/share/godot/export_templates
          key: godot-${{ hashFiles('.godot-version') }}-tools-v1
      - name: Prepare identical browser
        run: |
          node --check sjrpg_3d/tools/check_frame_pacing.mjs
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          tools/setup_godot.sh
      - name: Measure baseline and candidate on this same worker
        shell: bash
        run: |
          set -euo pipefail
          SJRPG_PACING_FAILED=0
          for SJRPG_PACING_EDITION in baseline candidate; do
            export SJRPG_PACING_EDITION
            if [[ "$SJRPG_PACING_EDITION" == baseline ]]; then
              export SJRPG_PACING_SHA=8fb18bf8d67467a8baf75fe91171f47ba8e09169
              git fetch --no-tags --depth=1 origin "$SJRPG_PACING_SHA"
            else
              export SJRPG_PACING_SHA="$GITHUB_SHA"
            fi
            export SJRPG_PACING_GAME="$RUNNER_TEMP/pacing-$SJRPG_PACING_EDITION"
            mkdir -p "$SJRPG_PACING_GAME" "build/frame-pacing/$SJRPG_PACING_EDITION"
            git archive "$SJRPG_PACING_SHA" | tar -x -C "$SJRPG_PACING_GAME"
            mkdir -p "$SJRPG_PACING_GAME/sjrpg_3d/tools/perf"
            cp sjrpg_3d/tools/perf/frame_pacing_observer.gd "$SJRPG_PACING_GAME/sjrpg_3d/tools/perf/"
            python3 - <<'PY'
          import os
          from pathlib import Path
          main=Path(os.environ["SJRPG_PACING_GAME"])/"sjrpg_3d/scripts/main.gd"
          source=main.read_text()
          needle="\tshow_title()\n"
          hook='\tif OS.has_feature("web") and str(JavaScriptBridge.eval("new URLSearchParams(window.location.search).get(\'frame_pacing_profile\')", true)) == "1":\n\t\tadd_child(load("res://tools/perf/frame_pacing_observer.gd").new().setup(self))\n'
          assert needle in source and "frame_pacing_observer.gd" not in source
          main.write_text(source.replace(needle,needle+hook,1))
          PY
            "$SJRPG_PACING_GAME/sjrpg_3d/tools/export_web.sh"
            python3 -m http.server 8796 --bind 127.0.0.1 --directory "$SJRPG_PACING_GAME/sjrpg_3d/build/web" > "build/frame-pacing/$SJRPG_PACING_EDITION/server.log" 2>&1 &
            SJRPG_PACING_SERVER=$!
            trap 'kill "$SJRPG_PACING_SERVER" 2>/dev/null || true' EXIT
            curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8796/ >/dev/null
            node sjrpg_3d/tools/check_frame_pacing.mjs http://127.0.0.1:8796/ "build/frame-pacing/$SJRPG_PACING_EDITION" || SJRPG_PACING_FAILED=1
            kill "$SJRPG_PACING_SERVER"
            wait "$SJRPG_PACING_SERVER" 2>/dev/null || true
            trap - EXIT
          done
          exit "$SJRPG_PACING_FAILED"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: actual-frame-pacing-comparison
          path: build/frame-pacing
          if-no-files-found: error
          retention-days: 7
