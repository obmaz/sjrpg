name: Recover the verified Pages artifact
on:
    push:
        branches: [main]
        paths: [.github/workflows/recover-reviewed-pages.yml]
    workflow_dispatch:
permissions:
    actions: read
    contents: read
    pages: write
    id-token: write
concurrency:
    group: github-pages
    cancel-in-progress: false
jobs:
    recover:
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[layout-review]'))
        runs-on: ubuntu-latest
        timeout-minutes: 35
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: 672d850a9b43928fa429d8888b32288683d5da6b
            - name: Verify the original successful build and failed deployment
              uses: actions/github-script@v8
              with:
                  script: |
                      const owner = 'obmaz', repo = 'sjrpg', run_id = 42374070706;
                      const baseline = '672d850a9b43928fa429d8888b32288683d5da6b';
                      // Compare the workflow event SHA, not the pinned source checkout.
                      // Recovery must never roll a later product revision back to this artifact.
                      const comparison = (await github.rest.repos.compareCommitsWithBasehead({
                        owner, repo, basehead: baseline + '...' + context.sha
                      })).data;
                      if (comparison.merge_base_commit.sha !== baseline ||
                          !comparison.files || comparison.files.length !== 1 ||
                          comparison.files[0].filename !== '.github/workflows/recover-reviewed-pages.yml' ||
                          comparison.files[0].status !== 'added' ||
                          comparison.files[0].previous_filename) {
                        throw new Error('Recovery event tree must differ from the reviewed source only by this new recovery workflow');
                      }
                      const run = (await github.rest.actions.getWorkflowRun({owner, repo, run_id})).data;
                      if (run.head_sha !== '672d850a9b43928fa429d8888b32288683d5da6b' ||
                          run.status !== 'completed' ||
                          !['failure','cancelled','timed_out'].includes(run.conclusion)) {
                        throw new Error('Recovery requires the pinned original deployment run to finish unsuccessfully');
                      }
                      const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                        {owner, repo, run_id, filter:'all', per_page:100});
                      if (!jobs.some(j => j.name === 'build' && j.conclusion === 'success'))
                        throw new Error('The original complete build/test/export gate did not pass');
                      const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                        {owner, repo, run_id, per_page:100});
                      const artifact = artifacts.find(a => a.id === 13575446821);
                      if (!artifact || artifact.name !== 'github-pages' || artifact.expired ||
                          artifact.size_in_bytes !== 73546245 ||
                          artifact.digest !== 'sha256:150ee4914b95433f25b717b4d79928f6d3b89444b587e2ba9eeaf3f4add063e5')
                        throw new Error('Original immutable Pages artifact identity/digest mismatch');
                      core.info(JSON.stringify({run_id, source:run.head_sha, artifact_id:artifact.id,
                        bytes:artifact.size_in_bytes, digest:artifact.digest}));
            - name: Download only the reviewed original site artifact
              uses: actions/download-artifact@v6
              with:
                  artifact-ids: 13575446821
                  run-id: 42374070706
                  github-token: ${{ github.token }}
                  path: build/original-pages
                  merge-multiple: true
            - name: Safely extract and verify the exact site payload
              run: |
                  test "$(git rev-parse HEAD)" = 672d850a9b43928fa429d8888b32288683d5da6b
                  test ! -f .native-style-review-hold
                  python3 - <<'PY'
                  import hashlib, importlib.util, json, re, shutil, tarfile
                  from pathlib import Path, PurePosixPath
                  source = Path("build/original-pages/artifact.tar")
                  assert source.is_file() and source.stat().st_size > 0, "Missing original artifact.tar"
                  output = Path("build/recovered-site")
                  output.mkdir(parents=True, exist_ok=False)
                  seen = set()
                  total = 0
                  manifest = {}
                  with tarfile.open(source, "r:*") as archive:
                      for member in archive:
                          raw = member.name
                          relative = PurePosixPath(raw)
                          assert not relative.is_absolute() and ".." not in raw.split("/"), ("Unsafe archive path", raw)
                          assert member.isdir() or member.isfile(), ("Archive links/special entries forbidden", raw)
                          if str(relative) == ".":
                              assert member.isdir()
                              continue
                          key = relative.as_posix()
                          assert key not in seen, ("Duplicate archive entry", key)
                          seen.add(key)
                          target = output.joinpath(*relative.parts)
                          assert target.resolve().is_relative_to(output.resolve())
                          if member.isdir():
                              target.mkdir(parents=True, exist_ok=True)
                              continue
                          total += member.size
                          assert 0 <= member.size <= 1024**3 and total <= 1024**3, "Unexpected archive size"
                          target.parent.mkdir(parents=True, exist_ok=True)
                          stream = archive.extractfile(member)
                          assert stream is not None
                          with stream, target.open("xb") as handle:
                              shutil.copyfileobj(stream, handle)
                          assert target.stat().st_size == member.size
                          manifest[key] = hashlib.sha256(target.read_bytes()).hexdigest()
                  assert (output / "index.html").is_file(), "Missing edition chooser"
                  assert (output / ".nojekyll").is_file(), "Missing original Pages marker"
                  editions = {}
                  for edition in ("2d", "3d"):
                      directory = output / edition
                      html = (directory / "index.html").read_text(encoding="utf-8")
                      spec = importlib.util.spec_from_file_location("stamp_" + edition,
                          Path("sjrpg_" + edition) / "tools/stamp_web.py")
                      helper = importlib.util.module_from_spec(spec)
                      spec.loader.exec_module(helper)
                      config, _, _ = helper.read_config(html)
                      name = config.get("mainPack", "")
                      assert helper.PACK_NAME.fullmatch(name), ("Unstamped PCK", edition, name)
                      pack = directory / name
                      assert pack.is_file() and pack.stat().st_size > 0
                      digest = helper.digest(pack)
                      assert name == "index-" + digest[:20] + ".pck", ("PCK filename hash mismatch", edition)
                      assert config["fileSizes"][name] == pack.stat().st_size, ("PCK size mismatch", edition)
                      assert 'window.__sjrpgBuild = "' + digest + '"' in html, ("Build marker mismatch", edition)
                      assert (directory / "index.wasm").is_file() and (directory / "index.wasm").stat().st_size > 0
                      editions[edition] = {"pack": name, "sha256": digest, "bytes": pack.stat().st_size}
                  Path("build/recovered-payload-manifest.json").write_text(json.dumps({
                      "source_run": 42374070706, "source_artifact": 13575446821,
                      "source_commit": "672d850a9b43928fa429d8888b32288683d5da6b",
                      "files": manifest, "editions": editions}, indent=2))
                  print(json.dumps({"files":len(manifest), "bytes":total, "editions":editions}))
                  PY
            - name: Re-upload the same verified site files
              uses: actions/upload-pages-artifact@v5.0.0
              with:
                  path: build/recovered-site
                  include-hidden-files: true
            - uses: actions/configure-pages@v6.0.0
              with:
                  enablement: true
            - name: Publish the reviewed artifact
              id: deployment
              timeout-minutes: 20
              uses: actions/deploy-pages@v5.0.1
              with:
                  timeout: 1200000
            - name: Confirm the public indexes match the immutable recovered payload
              run: |
                  python3 - <<'PY'
                  import hashlib, json, time, urllib.request
                  from pathlib import Path
                  manifest = json.loads(Path("build/recovered-payload-manifest.json").read_text())
                  for relative in ("index.html", "2d/index.html", "3d/index.html"):
                      url = "https://obmaz.github.io/sjrpg/" + relative + "?recovery=672d850a9b43928fa429d8888b32288683d5da6b"
                      matched = False
                      for attempt in range(8):
                          try:
                              request = urllib.request.Request(url, headers={"Cache-Control":"no-cache"})
                              with urllib.request.urlopen(request, timeout=20) as response:
                                  payload = response.read()
                              matched = hashlib.sha256(payload).hexdigest() == manifest["files"][relative]
                              if matched:
                                  break
                          except OSError as error:
                              print(type(error).__name__ + ": " + str(error))
                          if attempt < 7:
                              time.sleep(2)
                      assert matched, "Published index differs from the reviewed artifact: " + relative
                  print("Public root/2d/3d indexes match the recovered immutable payload")
                  PY
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Verify the same reviewed build in a fresh public browser
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
                  mkdir -p build/published-review
                  curl --fail --silent --show-error --max-time 10 --retry 8 --retry-delay 2 https://obmaz.github.io/sjrpg/ > build/published-review/chooser.html
                  SJRPG_STYLE_SMOKE=1 node sjrpg_3d/tools/check_native_style.mjs "https://obmaz.github.io/sjrpg/3d/?v=672d850a9b43928fa429d8888b32288683d5da6b" build/published-review
            - name: Preserve transport identity and public proof
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: recovered-reviewed-pages-proof
                  path: |
                      build/recovered-payload-manifest.json
                      build/published-review
                  if-no-files-found: ignore
                  retention-days: 7
