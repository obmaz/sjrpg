name: Audit actual 3D asset budget
# 자동 검증은 web.yml의 tools/ci.sh가 담당한다. 이 작업은 필요할 때 수동 실행한다.
on:
    workflow_dispatch:
permissions:
    contents: write
concurrency:
    group: asset-budget-${{ github.sha }}
    cancel-in-progress: false
jobs:
    inventory:
        runs-on: ubuntu-24.04
        timeout-minutes: 22
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Install metadata reader and pinned engine
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y python3-pil
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
            - name: Export actual 3D production pack
              run: sjrpg_3d/tools/export_web.sh
            - name: Inventory pack, image imports and mesh accessors without editing assets
              env:
                  SJRPG_ASSET_TOKEN: ${{ github.token }}
              run: python3 sjrpg_3d/tools/perf/asset_budget.py
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: actual-3d-asset-budget
                  path: build/asset-budget
                  if-no-files-found: ignore
                  retention-days: 7
