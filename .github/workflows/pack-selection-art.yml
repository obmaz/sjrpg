name: Pack reviewed selection artwork
# 자동 검증은 web.yml의 tools/ci.sh가 담당한다. 이 작업은 필요할 때 수동 실행한다.
on:
    workflow_dispatch:
permissions:
    contents: write
concurrency:
    group: selection-art-pack-${{ github.sha }}
    cancel-in-progress: false
jobs:
    pack:
        runs-on: ubuntu-24.04
        timeout-minutes: 12
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Install standard WebP encoder
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y webp
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Install pinned Godot
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
            - name: Compress originals, verify imports, publish unreferenced blobs
              env:
                  SJRPG_ASSET_TOKEN: ${{ github.token }}
              run: python3 sjrpg_3d/tools/entry_art/pack_selection_art.py
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: selection-art-candidate
                  path: build/selection-art
                  if-no-files-found: ignore
                  retention-days: 7
