name: Review cave swarm and combat visibility
on:
  push:
    paths:
      - ".github/workflows/gameplay-polish-review.yml"
      - "sjrpg_3d/tools/perf/analyze_sprite_atlas.py"
      - "sjrpg_3d/tools/check_combat_visibility.mjs"
      - "sjrpg_3d/tools/perf/combat_visibility_review.gd"
      - "sjrpg_3d/scripts/native_cave_lanterns_3d.gd"
      - "sjrpg_3d/scripts/native_zone_fx_3d.gd"
      - "sjrpg_3d/scripts/encounter_runtime.gd"
      - "sjrpg_3d/tests/cases/cave_swarm.gd"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.godot-tools
            ~/.local/share/godot/export_templates
          key: godot-${{ hashFiles('.godot-version') }}-tools-v1
      - name: Import and test real combat, slots and cave contracts
        run: |
          tools/setup_godot.sh
          sjrpg_3d/tools/check.sh --only=native_cave_torches,native_enemy_feedback,native_zone_fx,save_exit_guard,native_enemy_sprites,cave_swarm,native_cave_geometry,background,entry_loading,save_slots,quests,dungeon,encounters,encounter_combat,encounter_saving,native_encounter_props,native_projectile_fx,ortho_3d_motion,native_render_budget
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Read actual generated atlas alpha and frame bounds
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 sjrpg_3d/tools/perf/analyze_sprite_atlas.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cave-crawler-atlas-audit
          path: sjrpg_3d/build/gameplay-review
          retention-days: 7
  capture:
    if: "!contains(github.event.head_commit.message, '[test-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [baseline, candidate]
    env:
      SJRPG_VISIBILITY_EDITION: ${{ matrix.edition }}
      SJRPG_VISIBILITY_SHA: ${{ matrix.edition == 'baseline' && 'b464f036d922be7f235287bf907d13c605bc79f8' || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.godot-tools
            ~/.local/share/godot/export_templates
          key: godot-${{ hashFiles('.godot-version') }}-tools-v1
      - name: Prepare browser and exact disposable source
        run: |
          node --check sjrpg_3d/tools/check_combat_visibility.mjs
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          tools/setup_godot.sh
          export SJRPG_VISIBILITY_GAME="$RUNNER_TEMP/visibility-game"
          mkdir -p "$SJRPG_VISIBILITY_GAME"
          if [ "$SJRPG_VISIBILITY_SHA" != "$GITHUB_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$SJRPG_VISIBILITY_SHA"
          fi
          git archive "$SJRPG_VISIBILITY_SHA" | tar -x -C "$SJRPG_VISIBILITY_GAME"
          cp sjrpg_3d/tools/perf/combat_visibility_review.gd "$SJRPG_VISIBILITY_GAME/sjrpg_3d/scripts/"
          python3 - <<'PY'
          import os
          from pathlib import Path
          main=Path(os.environ["SJRPG_VISIBILITY_GAME"])/"sjrpg_3d/scripts/main.gd"
          source=main.read_text();needle="\tshow_title()\n"
          hook='\tif OS.has_feature("web") and str(JavaScriptBridge.eval("new URLSearchParams(window.location.search).get(\'combat_visibility_review\')", true)) == "1":\n\t\tadd_child(load("res://scripts/combat_visibility_review.gd").new().setup(self))\n'
          assert needle in source and "combat_visibility_review.gd" not in source
          main.write_text(source.replace(needle,needle+hook,1))
          PY
          "$SJRPG_VISIBILITY_GAME/sjrpg_3d/tools/export_web.sh"
      - name: Capture the explicit native fixtures in both orientations
        run: |
          set -euo pipefail
          mkdir -p "build/combat-visibility/$SJRPG_VISIBILITY_EDITION"
          python3 -m http.server 8797 --bind 127.0.0.1 --directory "$RUNNER_TEMP/visibility-game/sjrpg_3d/build/web" > "build/combat-visibility/$SJRPG_VISIBILITY_EDITION/server.log" 2>&1 &
          SJRPG_VISIBILITY_SERVER=$!
          trap 'kill "$SJRPG_VISIBILITY_SERVER" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8797/ >/dev/null
          node sjrpg_3d/tools/check_combat_visibility.mjs http://127.0.0.1:8797/ "build/combat-visibility/$SJRPG_VISIBILITY_EDITION"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: combat-visibility-${{ matrix.edition }}
          path: build/combat-visibility/${{ matrix.edition }}
          if-no-files-found: error
          retention-days: 7
  compare:
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: combat-visibility-*
          path: build/combat-visibility
      - run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Compare real browser captures without modifying source artwork
        shell: python
        run: |
          import pathlib,json,base64
          from PIL import Image,ImageDraw
          root=pathlib.Path("build/combat-visibility")
          before=root/"combat-visibility-baseline";after=root/"combat-visibility-candidate"
          a=json.loads((before/"proof.json").read_text());b=json.loads((after/"proof.json").read_text())
          assert a["passed"] and b["passed"]
          assert len(a["cases"])==16 and len(b["cases"])==16
          target=root/"comparisons";target.mkdir()
          for case in b["cases"]:
              name=case["name"];reference=next(x for x in a["cases"] if x["name"]==name)
              assert case["viewport"]==reference["viewport"]
              assert case["state"]["native_size"]==reference["state"]["native_size"]
              left=Image.open(before/case["screenshot"]).convert("RGB")
              right=Image.open(after/case["screenshot"]).convert("RGB")
              assert left.size==right.size
              scale=min(1,640/left.width);size=(round(left.width*scale),round(left.height*scale))
              left=left.resize(size,Image.Resampling.LANCZOS);right=right.resize(size,Image.Resampling.LANCZOS)
              pair=Image.new("RGB",(size[0]*2,size[1]+28),"#18201d")
              pair.paste(left,(0,28));pair.paste(right,(size[0],28))
              draw=ImageDraw.Draw(pair);draw.text((8,7),name+" | BEFORE",fill="#e9dfc9");draw.text((size[0]+8,7),"AFTER",fill="#e9dfc9")
              output=target/(name+".jpg");pair.save(output,quality=88)
              if name in ["cave_torches-portrait","cave_swarm-portrait","sprite_directions-landscape","sprite_corpses-landscape"]:
                  data=base64.b64encode(output.read_bytes()).decode()
                  print("GAMEPLAY_IMAGE_BEGIN "+name)
                  for i in range(0,len(data),16000):print("GAMEPLAY_IMAGE_CHUNK "+name+" "+data[i:i+16000])
                  print("GAMEPLAY_IMAGE_END "+name)
          print("GAMEPLAY_VISUAL_COMPARE_PASS 16 paired explicit fixtures; not performance evidence")
      - uses: actions/upload-artifact@v6
        with:
          name: gameplay-visibility-comparisons
          path: build/combat-visibility/comparisons
          retention-days: 7
