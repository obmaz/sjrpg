name: Report completed 3D resource profiles
on:
    push:
        paths:
            - ".github/workflows/resource-profile-report.yml"
            - "sjrpg_3d/tools/compare_resource_profile.py"
    workflow_dispatch:
        inputs:
            source_run:
                description: Completed resource profile workflow run
                default: "42395730787"
                required: true
permissions:
    contents: read
    actions: read
jobs:
    report:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            SOURCE_RUN: ${{ github.event.inputs.source_run || '42395730787' }}
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Validate syntax and completed real profile jobs
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  python3 -m py_compile sjrpg_3d/tools/compare_resource_profile.py
                  python3 - <<'PY'
                  import json,os,urllib.request
                  from pathlib import Path
                  run=os.environ["SOURCE_RUN"]
                  assert run.isdigit(),"Source run must be a numeric Actions run ID"
                  base="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+run
                  def fetch(url):
                      req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
                      return json.load(urllib.request.urlopen(req,timeout=30))
                  metadata=fetch(base)
                  assert metadata["name"]=="Profile actual 3D resource lifecycle",metadata["name"]
                  jobs=fetch(base+"/jobs?per_page=100")["jobs"]
                  for name in ["profile (before)","profile (after)"]:
                      job=next(j for j in jobs if j["name"]==name)
                      assert job["conclusion"]=="success",job
                  root=Path("build/resource-review")
                  root.mkdir(parents=True,exist_ok=True)
                  (root/"source-run.json").write_text(json.dumps({"source_run":run,"head_sha":metadata["head_sha"],"url":metadata["html_url"],"validated_profile_jobs":[j["id"] for j in jobs if j["name"].startswith("profile (")]},indent=2))
                  PY
            - uses: actions/download-artifact@v4
              with:
                  github-token: ${{ github.token }}
                  run-id: ${{ env.SOURCE_RUN }}
                  name: resource-profile-before
                  path: build/resource-review/before
            - uses: actions/download-artifact@v4
              with:
                  github-token: ${{ github.token }}
                  run-id: ${{ env.SOURCE_RUN }}
                  name: resource-profile-after
                  path: build/resource-review/after
            - name: Validate provenance and compare without recapturing
              run: |
                  python3 - <<'PY'
                  import json
                  from pathlib import Path
                  root=Path("build/resource-review")
                  metadata=json.loads((root/"source-run.json").read_text())
                  before=json.loads((root/"before/profile.json").read_text())
                  after=json.loads((root/"after/profile.json").read_text())
                  assert before["source_sha"]=="f3fa9f32caa0cfde08f8f1627431816bde01e00f"
                  assert after["source_sha"]==metadata["head_sha"]
                  assert before["passed"] and after["passed"]
                  PY
                  python3 sjrpg_3d/tools/compare_resource_profile.py build/resource-review
                  python3 - <<'PY'
                  import json
                  from pathlib import Path
                  proof=json.loads(Path("build/resource-review/comparison.json").read_text())
                  print("RESOURCE_PAIRED_PHASES "+json.dumps(proof))
                  PY
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: resource-profile-final-report
                  path: build/resource-review
                  retention-days: 7
