name: Candidate UI and native model diagnostics
# Verify owned paused music voices and scene teardown without extra runner timing.

on:
    push:
        paths:
            - ".github/workflows/native-candidate-smoke.yml"
            - "sjrpg_3d/scripts/gamepad_*.gd"
            - "sjrpg_3d/scripts/player.gd"
            - "sjrpg_3d/scripts/game.gd"
            - "sjrpg_3d/scripts/settings_panel.gd"
            - "sjrpg_3d/tests/cases/gamepad*.gd"
            - "sjrpg_3d/scripts/main.gd"
            - "sjrpg_3d/scripts/entry_loading.gd"
            - "sjrpg_3d/tests/cases/entry_loading.gd"
            - "sjrpg_3d/scripts/native_*.gd"
            - "sjrpg_3d/scripts/ortho_3d*.gd"
            - "sjrpg_3d/scripts/hud*.gd"
            - "sjrpg_3d/scripts/potion_art.gd"
            - "sjrpg_3d/scripts/skill_tree_panel.gd"
            - "sjrpg_3d/assets/art/hud/**"
            - "sjrpg_3d/tools/check_native_style.mjs"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: native-candidate-diagnostics-${{ github.sha }}
    cancel-in-progress: false

jobs:
    candidate_tests:
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Run the exact focused native and UI cases independently
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
                  tools/check.sh --project=3d --only=gamepad_navigation,gamepad_gameplay,skills,native_actor_materials,entry_layout,entry_loading,native_residents,native_merchant,music,npc_clearance,journey,render_budget,ui_input,native_forest_props,native_warrior,native_enemy_models,ui_tone,native_environment,ortho_3d_preview,native_scenery_props,native_cave_geometry,dungeon_art,quests,native_encounter_props,native_enemy_scale,native_enemy_radius,encounters,world_zoom,spatial_combat,spatial_world_3d,corpses,melee_elevation,bridge,spatial_stairs,town_gate_closure
    candidate_smoke:
        if: "!contains(github.event.head_commit.message, '[tests-only]')"
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install actual browser
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Import and export the actual candidate
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
                  sjrpg_3d/tools/export_web.sh
            - name: Run candidate_smoke through the actual main scene
              run: |
                  mkdir -p build/native-candidate/candidate_smoke
                  python3 -m http.server 8782 --bind 127.0.0.1 --directory sjrpg_3d/build/web > build/native-candidate/candidate_smoke/server.log 2>&1 &
                  SJRPG_CANDIDATE_SERVER_PID=$!
                  trap 'kill "$SJRPG_CANDIDATE_SERVER_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8782/ > /dev/null
                  SJRPG_STYLE_SMOKE=1 node sjrpg_3d/tools/check_native_style.mjs http://127.0.0.1:8782/ build/native-candidate/candidate_smoke
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: native-candidate-candidate_smoke
                  path: build/native-candidate/candidate_smoke
                  if-no-files-found: ignore
                  retention-days: 7
    candidate_models:
        if: "!contains(github.event.head_commit.message, '[tests-only]')"
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install actual browser
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Import and export the actual candidate
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
                  sjrpg_3d/tools/export_web.sh
            - name: Run candidate_models through the actual main scene
              run: |
                  mkdir -p build/native-candidate/candidate_models
                  python3 -m http.server 8783 --bind 127.0.0.1 --directory sjrpg_3d/build/web > build/native-candidate/candidate_models/server.log 2>&1 &
                  SJRPG_CANDIDATE_SERVER_PID=$!
                  trap 'kill "$SJRPG_CANDIDATE_SERVER_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8783/ > /dev/null
                  SJRPG_STYLE_MODELS_ONLY=1 node sjrpg_3d/tools/check_native_style.mjs http://127.0.0.1:8783/ build/native-candidate/candidate_models
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: native-candidate-candidate_models
                  path: build/native-candidate/candidate_models
                  if-no-files-found: ignore
                  retention-days: 7
