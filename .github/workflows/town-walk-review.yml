name: Reproduce continuous town walking memory
# 자동 검증은 web.yml의 tools/ci.sh가 담당한다. 이 작업은 필요할 때 수동 실행한다.
on:
    workflow_dispatch:
        inputs:
            source_ref:
                description: App commit to export with the current read-only observer
                default: ""
                required: false
            duration_ms:
                description: Real wall milliseconds of continuous input, 30000 to 300000
                default: "90000"
                required: false
permissions:
    contents: read
jobs:
    walking:
        runs-on: ubuntu-latest
        timeout-minutes: 18
        strategy:
            fail-fast: false
            matrix:
                edition: [baseline, candidate]
                variant: [mage-high-touch, mage-high-keys, warrior-high-touch, mage-low-touch]
        env:
            SJRPG_WALK_EDITION: ${{ matrix.edition }}
            SJRPG_WALK_VARIANT: ${{ matrix.variant }}
            SJRPG_WALK_SHA: ${{ matrix.edition == 'baseline' && '3f4c9fe347bd58fa2fc2c609671b4de549a1b09b' || github.event.inputs.source_ref || github.sha }}
            SJRPG_WALK_DURATION_MS: ${{ github.event.inputs.duration_ms || '90000' }}
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - name: Validate JavaScript and install browser
              run: |
                  node --check sjrpg_3d/tools/check_town_walking.mjs
                  node --check sjrpg_3d/tools/walking_resource_telemetry.mjs
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Prepare exact app and read-only walking observer
              run: |
                  mkdir -p "$RUNNER_TEMP/walk-game"
                  if [ "$SJRPG_WALK_SHA" != "$GITHUB_SHA" ]; then
                      git fetch --no-tags --depth=1 origin "$SJRPG_WALK_SHA"
                  fi
                  git archive "$SJRPG_WALK_SHA" | tar -x -C "$RUNNER_TEMP/walk-game"
                  cp sjrpg_3d/scripts/inspection/walking_resource_review.gd "$RUNNER_TEMP/walk-game/sjrpg_3d/scripts/inspection/walking_resource_review.gd"
                  cp sjrpg_3d/tools/check_town_walking.mjs sjrpg_3d/tools/resource_telemetry.mjs sjrpg_3d/tools/walking_resource_telemetry.mjs "$RUNNER_TEMP/walk-game/sjrpg_3d/tools/"
                  python3 - <<'PY'
                  import os
                  from pathlib import Path
                  main=Path(os.environ["RUNNER_TEMP"])/"walk-game/sjrpg_3d/scripts/app/main.gd"
                  text=main.read_text()
                  needle="\tshow_title()\n"
                  hook='\tif OS.has_feature("web") and str(JavaScriptBridge.eval("new URLSearchParams(window.location.search).get(\'walking_profile\')", true)) == "1":\n\t\tadd_child(load("res://scripts/inspection/walking_resource_review.gd").new().setup(self))\n'
                  assert needle in text
                  assert 'res://scripts/inspection/walking_resource_review.gd' not in text
                  main.write_text(text.replace(needle,needle+hook,1))
                  PY
                  ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/walk-game/node_modules"
                  chmod +x "$RUNNER_TEMP/walk-game/tools/"*.sh "$RUNNER_TEMP/walk-game/sjrpg_3d/tools/"*.sh
                  "$RUNNER_TEMP/walk-game/tools/setup_godot.sh"
            - name: Export the actual 3D app
              working-directory: ${{ runner.temp }}/walk-game
              run: sjrpg_3d/tools/export_web.sh
            - name: Walk from ordinary spawn through real controls
              run: |
                  mkdir -p "build/town-walk/$SJRPG_WALK_EDITION/$SJRPG_WALK_VARIANT"
                  python3 -m http.server 8792 --bind 127.0.0.1 --directory "$RUNNER_TEMP/walk-game/sjrpg_3d/build/web" > "build/town-walk/$SJRPG_WALK_EDITION/$SJRPG_WALK_VARIANT/server.log" 2>&1 &
                  SJRPG_WALK_SERVER=$!
                  trap 'kill "$SJRPG_WALK_SERVER" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8792/ > /dev/null
                  node "$RUNNER_TEMP/walk-game/sjrpg_3d/tools/check_town_walking.mjs" http://127.0.0.1:8792/ "$GITHUB_WORKSPACE/build/town-walk/$SJRPG_WALK_EDITION/$SJRPG_WALK_VARIANT"
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: town-walk-${{ matrix.edition }}-${{ matrix.variant }}
                  path: build/town-walk/${{ matrix.edition }}/${{ matrix.variant }}
                  if-no-files-found: ignore
                  retention-days: 7
