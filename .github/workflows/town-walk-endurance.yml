name: Diagnose town walking buffer churn
on:
    push:
        paths:
            - ".github/workflows/town-walk-endurance.yml"
            - "sjrpg_3d/tools/perf/prepare_walk_endurance.py"
    workflow_dispatch:
        inputs:
            candidate_sha:
                description: Exact minimap-batch candidate commit
                default: "5ae5a8e403c5276ac633b5dcffc33ad4c56da819"
                required: true
permissions:
    contents: read
jobs:
    endurance:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: baseline-on
                      wrappers: "on"
                      edition: baseline
                    - label: baseline-off
                      wrappers: "off"
                      edition: baseline
                    - label: batch-on
                      wrappers: "on"
                      edition: candidate
        env:
            SJRPG_GL_WRAPPERS: ${{ matrix.wrappers }}
            SJRPG_WALK_SHA: ${{ matrix.edition == 'baseline' && '6a63c301e60055b74beb6a5f990af1cfe8e2e5b4' || github.event.inputs.candidate_sha || '5ae5a8e403c5276ac633b5dcffc33ad4c56da819' }}
            SJRPG_HARNESS_SHA: ${{ github.sha }}
            SJRPG_WALK_VARIANT: mage-high-keys
            SJRPG_WALK_EDITION: ${{ matrix.label }}
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - name: Validate overlay and install browser
              run: |
                  python3 -m py_compile sjrpg_3d/tools/perf/prepare_walk_endurance.py
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Archive each pinned app for paired controls
              run: |
                  python3 - <<'PY'
                  import os,re
                  assert re.fullmatch(r"[0-9a-f]{40}",os.environ["SJRPG_WALK_SHA"])
                  PY
                  git fetch --no-tags --depth=1 origin "$SJRPG_WALK_SHA"
                  mkdir -p "$RUNNER_TEMP/endurance-game"
                  git archive "$SJRPG_WALK_SHA" | tar -x -C "$RUNNER_TEMP/endurance-game"
                  cp sjrpg_3d/scripts/walking_resource_review.gd "$RUNNER_TEMP/endurance-game/sjrpg_3d/scripts/walking_resource_review.gd"
                  cp sjrpg_3d/tools/check_town_walking.mjs sjrpg_3d/tools/resource_telemetry.mjs sjrpg_3d/tools/walking_resource_telemetry.mjs "$RUNNER_TEMP/endurance-game/sjrpg_3d/tools/"
                  python3 - <<'PY'
                  import os
                  from pathlib import Path
                  main=Path(os.environ["RUNNER_TEMP"])/"endurance-game/sjrpg_3d/scripts/main.gd"
                  text=main.read_text()
                  needle="\tshow_title()\n"
                  hook='\tif OS.has_feature("web") and str(JavaScriptBridge.eval("new URLSearchParams(window.location.search).get(\'walking_profile\')", true)) == "1":\n\t\tadd_child(load("res://scripts/walking_resource_review.gd").new().setup(self))\n'
                  assert needle in text
                  assert 'res://scripts/walking_resource_review.gd' not in text
                  main.write_text(text.replace(needle,needle+hook,1))
                  PY
                  python3 sjrpg_3d/tools/perf/prepare_walk_endurance.py
                  node --check "$RUNNER_TEMP/endurance-game/sjrpg_3d/tools/check_town_walking.mjs"
                  node --check "$RUNNER_TEMP/endurance-game/sjrpg_3d/tools/resource_telemetry.mjs"
                  node --check "$RUNNER_TEMP/endurance-game/sjrpg_3d/tools/walking_resource_telemetry.mjs"
                  ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/endurance-game/node_modules"
                  chmod +x "$RUNNER_TEMP/endurance-game/tools/"*.sh "$RUNNER_TEMP/endurance-game/sjrpg_3d/tools/"*.sh
                  "$RUNNER_TEMP/endurance-game/tools/setup_godot.sh"
            - name: Export actual app with the workspace-only observer
              working-directory: ${{ runner.temp }}/endurance-game
              run: sjrpg_3d/tools/export_web.sh
            - name: Hold real town movement through 400 rendered frames
              run: |
                  mkdir -p "build/town-endurance/$SJRPG_WALK_EDITION"
                  python3 -m http.server 8793 --bind 127.0.0.1 --directory "$RUNNER_TEMP/endurance-game/sjrpg_3d/build/web" > "build/town-endurance/$SJRPG_WALK_EDITION/server.log" 2>&1 &
                  SJRPG_ENDURANCE_SERVER=$!
                  trap 'kill "$SJRPG_ENDURANCE_SERVER" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8793/ > /dev/null
                  node "$RUNNER_TEMP/endurance-game/sjrpg_3d/tools/check_town_walking.mjs" http://127.0.0.1:8793/ "$GITHUB_WORKSPACE/build/town-endurance/$SJRPG_WALK_EDITION"
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: town-endurance-${{ matrix.label }}
                  path: build/town-endurance/${{ matrix.label }}
                  if-no-files-found: ignore
                  retention-days: 7
