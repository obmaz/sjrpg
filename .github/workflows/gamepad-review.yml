name: Review Xbox gamepad controls

on:
    push:
        paths:
            - ".github/workflows/gamepad-review.yml"
            - "sjrpg_3d/tools/check_gamepad.mjs"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: gamepad-review-${{ github.sha }}
    cancel-in-progress: false

jobs:
    review:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install browser harness
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Check controller gameplay and menu navigation
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
                  tools/check.sh --project=3d --only=gamepad_gameplay,gamepad_navigation,ui_input,entry_layout,entry_loading
            - name: Export native UI for visual diagnostics
              id: native_export
              if: success() || failure()
              run: sjrpg_3d/tools/export_web.sh
            - name: Run the exported controller browser harness
              if: (success() || failure()) && steps.native_export.outcome == 'success'
              run: |
                  mkdir -p build/gamepad-review
                  python3 -m http.server 8781 --bind 127.0.0.1 --directory sjrpg_3d/build/web > build/gamepad-review/server.log 2>&1 &
                  SJRPG_GAMEPAD_SERVER_PID=$!
                  trap 'kill "$SJRPG_GAMEPAD_SERVER_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8781/ > /dev/null
                  node sjrpg_3d/tools/check_gamepad.mjs http://127.0.0.1:8781/ build/gamepad-review
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: gamepad-review
                  path: build/gamepad-review
                  if-no-files-found: ignore
                  retention-days: 7
