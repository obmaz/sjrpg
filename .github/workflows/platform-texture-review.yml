name: Review Web and Android texture compression
# Preserve existing texture UIDs and record first engine assignments separately.

# 자동 검증은 web.yml의 tools/ci.sh가 담당한다. 이 작업은 필요할 때 수동 실행한다.
on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: platform-texture-review-${{ github.sha }}
    cancel-in-progress: false

jobs:
    imports:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Check policy, actual native materials and exported blocks
              run: |
                  tools/setup_godot.sh
                  python3 sjrpg_3d/tools/review/publish_texture_imports.py snapshot --out sjrpg_3d/build/texture-imports/source-snapshot.json
                  timeout 240 tools/check.sh --project=3d --only=ortho_3d_materials,native_terrain_readability,native_encounter_props,native_house_family,native_mira,art_projection
                  sjrpg_3d/tools/export_web.sh
            - name: Publish verified engine-generated import metadata as blobs only
              env:
                  GH_TOKEN: ${{ github.token }}
              run: python3 sjrpg_3d/tools/review/publish_texture_imports.py publish --out sjrpg_3d/build/texture-imports/source-snapshot.json
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: verified-platform-texture-imports
                  path: |
                      sjrpg_3d/build/texture-imports
                      sjrpg_3d/build/web/platform-export.json
                  retention-days: 7
    capture:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                edition: [before, after]
        env:
            SJRPG_TEXTURE_EDITION: ${{ matrix.edition }}
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install actual browser
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Install pinned engine
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
            - name: Prepare exact edition with CI-only photography observer
              run: |
                  set -euo pipefail
                  if test "$SJRPG_TEXTURE_EDITION" = before; then
                      git fetch --depth=1 origin fa2ab4215446fd05cb6fbbe923f78b1eacd71a74
                      mkdir -p build/texture-baseline
                      git archive fa2ab4215446fd05cb6fbbe923f78b1eacd71a74 | tar -x -C build/texture-baseline
                      SJRPG_REVIEW_PROJECT=build/texture-baseline/sjrpg_3d
                  else
                      SJRPG_REVIEW_PROJECT=sjrpg_3d
                  fi
                  export SJRPG_REVIEW_PROJECT
                  python3 - <<'PY'
                  import os
                  from pathlib import Path
                  project = Path(os.environ["SJRPG_REVIEW_PROJECT"])
                  target = project / "scripts/texture_compression_ci_observer.gd"
                  target.write_text(Path("sjrpg_3d/tools/review/texture_compression_observer.gd").read_text())
                  main = project / "scripts/main.gd"
                  text = main.read_text()
                  needle = '\t\tadd_child(preload("res://scripts/native_style_review.gd").new().setup(self))\n'
                  assert text.count(needle) == 1, "Exact explicit review observer insertion point"
                  text = text.replace(needle, needle + '\t\tadd_child(preload("res://scripts/texture_compression_ci_observer.gd").new().setup(self))\n')
                  main.write_text(text)
                  PY
                  chmod +x "$SJRPG_REVIEW_PROJECT"/tools/*.sh
                  "$SJRPG_REVIEW_PROJECT/tools/export_web.sh"
                  echo "SJRPG_REVIEW_WEB=$SJRPG_REVIEW_PROJECT/build/web" >> "$GITHUB_ENV"
            - name: Inspect actual desktop and ETC2 GPU uploads and capture unchanged views
              run: |
                  set -euo pipefail
                  SJRPG_REVIEW_OUT="build/texture-compression-review/$SJRPG_TEXTURE_EDITION"
                  mkdir -p "$SJRPG_REVIEW_OUT"
                  python3 -m http.server 8786 --bind 127.0.0.1 --directory "$SJRPG_REVIEW_WEB" > "$SJRPG_REVIEW_OUT/server.log" 2>&1 &
                  SJRPG_REVIEW_SERVER_PID=$!
                  trap 'kill "$SJRPG_REVIEW_SERVER_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8786/ > /dev/null
                  if test "$SJRPG_TEXTURE_EDITION" = before; then export SJRPG_TEXTURE_REF=fa2ab4215446fd05cb6fbbe923f78b1eacd71a74; else export SJRPG_TEXTURE_REF="$GITHUB_SHA"; fi
                  node sjrpg_3d/tools/check_texture_compression.mjs http://127.0.0.1:8786/ "$SJRPG_REVIEW_OUT"
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: texture-${{ matrix.edition }}
                  path: build/texture-compression-review/${{ matrix.edition }}
                  if-no-files-found: ignore
                  retention-days: 7
    compare:
        needs: capture
        runs-on: ubuntu-latest
        timeout-minutes: 8
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/download-artifact@v6
              with:
                  name: texture-before
                  path: build/texture-compression-review/before
            - uses: actions/download-artifact@v6
              with:
                  name: texture-after
                  path: build/texture-compression-review/after
            - name: Compare real GPU format paths and paired screenshots without modifying refs
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  python3 -m pip install --disable-pip-version-check Pillow
                  python3 sjrpg_3d/tools/compare_texture_compression.py build/texture-compression-review
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: texture-comparison
                  path: build/texture-compression-review
                  if-no-files-found: ignore
                  retention-days: 7
