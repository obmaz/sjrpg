name: Review cave crawler artwork
on:
  push:
    paths:
      - ".github/workflows/crawler-art-review.yml"
      - "sjrpg_3d/assets/art/monsters/cave_crawler*.png"
      - "sjrpg_3d/assets/data/cave_crawler_sprite.json"
      - "sjrpg_3d/assets/source/cave-crawler/**"
      - "sjrpg_3d/tools/perf/analyze_sprite_atlas.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Audit actual alpha, bounds and reference previews
        shell: python
        run: |
          import base64,io,pathlib,json
          from PIL import Image
          root=pathlib.Path("sjrpg_3d")
          sources={
            "style":root/"assets/source/style/approved-game-reference.jpg",
            "live":root/"assets/art/monsters/cave_crawler.png",
            "corpses":root/"assets/art/monsters/cave_crawler_corpses.png",
            "candidate_live":root/"assets/source/cave-crawler/generated-atlas.png",
            "candidate_corpses":root/"assets/source/cave-crawler/generated-corpses.png"
          }
          for name,path in sources.items():
            image=Image.open(path).convert("RGBA")
            print("CRAWLER_SOURCE",name,image.size,path.stat().st_size)
            image.thumbnail((768,768),Image.Resampling.LANCZOS)
            buffer=io.BytesIO();image.save(buffer,format="PNG")
            data=base64.b64encode(buffer.getvalue()).decode()
            print("CRAWLER_IMAGE_BEGIN "+name)
            for i in range(0,len(data),8000):print("CRAWLER_IMAGE_CHUNK "+name+" "+data[i:i+8000])
            print("CRAWLER_IMAGE_END "+name)
      - run: python3 sjrpg_3d/tools/perf/analyze_sprite_atlas.py --source --columns=8
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: crawler-art-audit
          path: sjrpg_3d/build/gameplay-review
          retention-days: 7
