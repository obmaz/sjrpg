name: Review generated entry design

# 자동 검증은 web.yml의 tools/ci.sh가 담당한다. 이 작업은 필요할 때 수동 실행한다.
on:
    workflow_dispatch:

permissions:
    contents: read
    actions: read

concurrency:
    group: entry-design-review-${{ github.sha }}
    cancel-in-progress: false

jobs:
    before:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/cache@v4
              id: baseline
              with:
                  path: build/entry-design-review/before
                  key: entry-before-741d16366e4930644d3287fd97f7adc0745fd786-v1
            - uses: actions/setup-node@v6
              if: steps.baseline.outputs.cache-hit != 'true'
              with:
                  node-version: 24
                  cache: npm
            - name: Install browser for the one-time genuine baseline
              if: steps.baseline.outputs.cache-hit != 'true'
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              if: steps.baseline.outputs.cache-hit != 'true'
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Prepare immutable previous UI with current capture tool only
              if: steps.baseline.outputs.cache-hit != 'true'
              run: |
                  mkdir -p "$RUNNER_TEMP/entry-before"
                  git fetch --no-tags --depth=1 origin 741d16366e4930644d3287fd97f7adc0745fd786
                  git archive 741d16366e4930644d3287fd97f7adc0745fd786 | tar -x -C "$RUNNER_TEMP/entry-before"
                  cp sjrpg_3d/tools/check_save_layout.mjs "$RUNNER_TEMP/entry-before/sjrpg_3d/tools/check_save_layout.mjs"
                  ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/entry-before/node_modules"
                  chmod +x "$RUNNER_TEMP/entry-before/tools/"*.sh "$RUNNER_TEMP/entry-before/sjrpg_3d/tools/"*.sh
                  "$RUNNER_TEMP/entry-before/tools/setup_godot.sh"
            - name: Export previous actual UI once
              if: steps.baseline.outputs.cache-hit != 'true'
              working-directory: ${{ runner.temp }}/entry-before
              run: sjrpg_3d/tools/export_web.sh
            - name: Capture previous actual UI
              if: steps.baseline.outputs.cache-hit != 'true'
              env:
                  SJRPG_ENTRY_VISUAL_ONLY: "1"
                  SJRPG_ENTRY_BASELINE: "1"
              run: |
                  mkdir -p build/entry-design-review/before
                  python3 -m http.server 8778 --bind 127.0.0.1 --directory "$RUNNER_TEMP/entry-before/sjrpg_3d/build/web" > build/entry-design-review/before/server.log 2>&1 &
                  SJRPG_ENTRY_BEFORE_PID=$!
                  trap 'kill "$SJRPG_ENTRY_BEFORE_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8778/ > /dev/null
                  node "$RUNNER_TEMP/entry-before/sjrpg_3d/tools/check_save_layout.mjs" http://127.0.0.1:8778/ "$GITHUB_WORKSPACE/build/entry-design-review/before"
            - name: Preserve original baseline provenance
              if: steps.baseline.outputs.cache-hit != 'true' && success()
              run: |
                  python3 - <<'PY'
                  import json,os
                  from pathlib import Path
                  Path("build/entry-design-review/before/_provenance.json").write_text(json.dumps({"app_sha":"741d16366e4930644d3287fd97f7adc0745fd786","capture_run":os.environ["GITHUB_RUN_ID"],"capture_tool_sha":os.environ["GITHUB_SHA"],"baseline_capture_only":True,"new_class_geometry_checked":False},indent=2))
                  PY
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: entry-design-before
                  path: build/entry-design-review/before
                  retention-days: 7

    actual:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install browser
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Check native entry and save regression cases
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
                  tools/check.sh --project=3d --only=entry_layout,entry_loading,save_layout,save_time_label,save_slots,gamepad_navigation
            - name: Export redesigned actual UI
              id: export
              if: success() || failure()
              run: sjrpg_3d/tools/export_web.sh
            - name: Capture actual class and save UI
              if: (success() || failure()) && steps.export.outcome == 'success'
              env:
                  SJRPG_ENTRY_VISUAL_ONLY: "1"
              run: |
                  mkdir -p build/entry-design-review/actual
                  python3 -m http.server 8779 --bind 127.0.0.1 --directory sjrpg_3d/build/web > build/entry-design-review/actual/server.log 2>&1 &
                  SJRPG_ENTRY_ACTUAL_PID=$!
                  trap 'kill "$SJRPG_ENTRY_ACTUAL_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8779/ > /dev/null
                  node sjrpg_3d/tools/check_save_layout.mjs http://127.0.0.1:8779/ build/entry-design-review/actual
            - name: Preserve actual provenance
              if: always()
              run: |
                  mkdir -p build/entry-design-review/actual
                  python3 - <<'PY'
                  import json,os
                  from pathlib import Path
                  Path("build/entry-design-review/actual/_provenance.json").write_text(json.dumps({"app_sha":os.environ["GITHUB_SHA"],"capture_run":os.environ["GITHUB_RUN_ID"],"baseline_capture_only":False,"new_class_geometry_checked":True},indent=2))
                  PY
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: entry-design-actual
                  path: build/entry-design-review/actual
                  retention-days: 7

    compare:
        needs: [before, actual]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/download-artifact@v4
              with:
                  name: entry-design-before
                  path: build/entry-design-review/before
            - uses: actions/download-artifact@v4
              with:
                  name: entry-design-actual
                  path: build/entry-design-review/actual
            - name: Compose original concept and actual before/after
              run: |
                  python3 -m pip install --disable-pip-version-check Pillow
                  python3 sjrpg_3d/tools/compare_entry_design.py build/entry-design-review
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: entry-design-comparison
                  path: build/entry-design-review
                  retention-days: 7
