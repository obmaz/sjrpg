name: Probe the reviewed public build
on:
    push:
        branches: [main]
        paths: [.github/workflows/probe-reviewed-public.yml]
    workflow_dispatch:
permissions:
    actions: read
    contents: read
jobs:
    probe:
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[layout-review]'))
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: 672d850a9b43928fa429d8888b32288683d5da6b
            - name: Verify the original reviewed artifact identity
              uses: actions/github-script@v8
              with:
                  script: |
                      const owner='obmaz', repo='sjrpg', run_id=42374070706;
                      const run=(await github.rest.actions.getWorkflowRun({owner,repo,run_id})).data;
                      if(run.head_sha!=='672d850a9b43928fa429d8888b32288683d5da6b')
                        throw new Error('Original source commit mismatch');
                      const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                        {owner,repo,run_id,filter:'all',per_page:100});
                      if(!jobs.some(j=>j.name==='build'&&j.conclusion==='success'))
                        throw new Error('Original complete build/test/export gate did not pass');
                      const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
                        {owner,repo,run_id,per_page:100});
                      const artifact=artifacts.find(a=>a.id===13575446821);
                      if(!artifact||artifact.name!=='github-pages'||artifact.expired||
                         artifact.size_in_bytes!==73546245||
                         artifact.digest!=='sha256:150ee4914b95433f25b717b4d79928f6d3b89444b587e2ba9eeaf3f4add063e5')
                        throw new Error('Immutable original artifact identity/digest mismatch');
                      core.info(JSON.stringify({source:run.head_sha,run_id,artifact_id:artifact.id,digest:artifact.digest}));
            - uses: actions/download-artifact@v6
              with:
                  artifact-ids: 13575446821
                  run-id: 42374070706
                  github-token: ${{ github.token }}
                  path: build/original-pages
                  merge-multiple: true
            - name: Compare public indexes and streamed PCK with the original artifact
              run: |
                  test "$(git rev-parse HEAD)" = 672d850a9b43928fa429d8888b32288683d5da6b
                  mkdir -p build/public-probe
                  python3 - <<'PY'
                  import hashlib, importlib.util, json, re, tarfile, time, urllib.request
                  from pathlib import Path, PurePosixPath
                  report={"source":"672d850a9b43928fa429d8888b32288683d5da6b",
                          "artifact_id":13575446821,"checks":[],"passed":False}
                  destination=Path("build/public-probe/identity.json")
                  def stream_digest(stream):
                      sha=hashlib.sha256()
                      size=0
                      for chunk in iter(lambda:stream.read(1024*1024),b""):
                          sha.update(chunk)
                          size+=len(chunk)
                      return sha.hexdigest(),size
                  try:
                      with tarfile.open("build/original-pages/artifact.tar","r:*") as archive:
                          files={}
                          for member in archive:
                              relative=PurePosixPath(member.name)
                              assert not relative.is_absolute() and ".." not in member.name.split("/"), "Unsafe tar path"
                              assert member.isdir() or member.isfile(), "Tar link/special entry forbidden"
                              if member.isfile():
                                  name=relative.as_posix()
                                  assert name not in files, "Duplicate tar file"
                                  files[name]=member
                          expected=[]
                          for relative in ("index.html","2d/index.html","3d/index.html"):
                              assert relative in files, "Missing reviewed index: "+relative
                              with archive.extractfile(files[relative]) as handle:
                                  data=handle.read()
                              expected.append((relative,hashlib.sha256(data).hexdigest(),len(data)))
                              if relative=="3d/index.html":
                                  html=data.decode("utf-8")
                          spec=importlib.util.spec_from_file_location("reviewed_stamp","sjrpg_3d/tools/stamp_web.py")
                          helper=importlib.util.module_from_spec(spec)
                          spec.loader.exec_module(helper)
                          config,_,_=helper.read_config(html)
                          name=config.get("mainPack","")
                          assert helper.PACK_NAME.fullmatch(name), "Reviewed pack must use immutable stamped name"
                          relative="3d/"+name
                          assert relative in files, "Missing reviewed pack"
                          with archive.extractfile(files[relative]) as handle:
                              digest,size=stream_digest(handle)
                          assert name=="index-"+digest[:20]+".pck"
                          assert config["fileSizes"][name]==size
                          assert 'window.__sjrpgBuild = "'+digest+'"' in html
                          expected.append((relative,digest,size))
                      report["expected"]=[{"path":p,"sha256":s,"bytes":n} for p,s,n in expected]
                      for relative,digest,size in expected:
                          matched=False
                          attempts=[]
                          url="https://obmaz.github.io/sjrpg/"+relative+"?public_probe=672d850a9b43928fa429d8888b32288683d5da6b"
                          for attempt in range(6):
                              try:
                                  request=urllib.request.Request(url,headers={"Cache-Control":"no-cache"})
                                  with urllib.request.urlopen(request,timeout=60) as response:
                                      actual,received=stream_digest(response)
                                  matched=actual==digest and received==size
                                  attempts.append({"attempt":attempt+1,"sha256":actual,"bytes":received,"matched":matched})
                                  if matched:
                                      break
                              except OSError as error:
                                  attempts.append({"attempt":attempt+1,"error":str(error)})
                              if attempt<5:
                                  time.sleep(2)
                          check={"path":relative,"expected_sha256":digest,"expected_bytes":size,
                                 "attempts":attempts,"passed":matched}
                          report["checks"].append(check)
                          print(json.dumps(check),flush=True)
                          assert matched, "Public bytes do not match the reviewed artifact: "+relative
                      report["passed"]=True
                  finally:
                      destination.write_text(json.dumps(report,indent=2))
                  print("PUBLIC_REVIEWED_IDENTITY_PASS indexes=3 streamed_pck=1")
                  PY
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Run the pinned fresh-browser native smoke
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
                  SJRPG_STYLE_SMOKE=1 node sjrpg_3d/tools/check_native_style.mjs "https://obmaz.github.io/sjrpg/3d/?v=672d850a9b43928fa429d8888b32288683d5da6b" build/public-probe/browser
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: reviewed-public-identity-proof
                  path: build/public-probe
                  if-no-files-found: ignore
                  retention-days: 7
