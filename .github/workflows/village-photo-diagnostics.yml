name: Inspect diagnostic village photographs without release approval
on:
    push:
        paths:
            - ".github/workflows/village-photo-diagnostics.yml"
    workflow_dispatch:
        inputs:
            source_run_id:
                description: Actual architecture capture run to inspect
                type: string
                default: "42462205156"
permissions:
    contents: read
    actions: read
concurrency:
    group: village-photo-diagnostics-${{ github.sha }}
    cancel-in-progress: false
jobs:
    evidence:
        runs-on: ubuntu-latest
        timeout-minutes: 8
        permissions:
            contents: write
            actions: read
        env:
            SJRPG_DIAGNOSTIC_RUN: ${{ inputs.source_run_id || '42462205156' }}
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/download-artifact@v6
              with:
                  name: terrain-npc-before
                  path: build/village-photo-diagnostics/before
                  run-id: ${{ inputs.source_run_id || '42462205156' }}
                  github-token: ${{ github.token }}
            - uses: actions/download-artifact@v6
              with:
                  name: terrain-npc-after
                  path: build/village-photo-diagnostics/after
                  run-id: ${{ inputs.source_run_id || '42462205156' }}
                  github-token: ${{ github.token }}
            - name: Expose existing actual images as diagnostic evidence only
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  python3 -m pip install --disable-pip-version-check Pillow
                  python3 sjrpg_3d/tools/report_village_photo_diagnostics.py build/village-photo-diagnostics
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: diagnostic-village-photographs
                  path: build/village-photo-diagnostics
                  if-no-files-found: error
                  retention-days: 7
