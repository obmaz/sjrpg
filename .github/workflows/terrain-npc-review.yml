name: Review terrain water and elevation materials

# 자동 검증은 web.yml의 tools/ci.sh가 담당한다. 이 작업은 필요할 때 수동 실행한다.
on:
    workflow_dispatch:
        inputs:
            npcs:
                description: Include actual NPC factory previews
                type: boolean
                default: false
            npc_identities:
                description: Comma-separated newly imported identities
                type: string
                default: mira
            scope:
                description: Focused actual scene review
                type: choice
                options: [terrain, architecture, all]
                default: terrain

permissions:
    contents: read

concurrency:
    group: terrain-npc-review-${{ github.sha }}
    cancel-in-progress: false

jobs:
    capture:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                edition: [before, after]
        env:
            SJRPG_TERRAIN_EDITION: ${{ matrix.edition }}
            SJRPG_REVIEW_NPCS: ${{ inputs.npcs || 'false' }}
            SJRPG_REVIEW_NPC_IDENTITIES: ${{ inputs.npc_identities || 'mira' }}
            SJRPG_REVIEW_SCOPE: ${{ inputs.scope || 'terrain' }}
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install actual browser
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Install pinned engine
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
            - name: Check actual terrain and combat height contracts
              if: matrix.edition == 'after'
              run: |
                  if test "$SJRPG_REVIEW_SCOPE" = architecture; then
                      tools/check.sh --project=3d --only=native_house_family,ortho_3d_fortification,spatial_stairs,bridge
                  else
                      tools/check.sh --project=3d --only=native_terrain_readability,melee_elevation,spatial_stairs,bridge
                  fi
            - name: Prepare exact edition with CI-only photography observer
              run: |
                  set -euo pipefail
                  if test "$SJRPG_TERRAIN_EDITION" = before; then
                      git fetch --depth=1 origin 99d0fd5e779752d5d2e4f14735fe585d8459313e
                      mkdir -p build/terrain-npc-baseline
                      git archive 99d0fd5e779752d5d2e4f14735fe585d8459313e | tar -x -C build/terrain-npc-baseline
                      SJRPG_REVIEW_PROJECT=build/terrain-npc-baseline/sjrpg_3d
                  else
                      SJRPG_REVIEW_PROJECT=sjrpg_3d
                  fi
                  export SJRPG_REVIEW_PROJECT
                  python3 - <<'PY'
                  import os
                  from pathlib import Path
                  project = Path(os.environ["SJRPG_REVIEW_PROJECT"])
                  target = project / "scripts/terrain_npc_ci_observer.gd"
                  target.write_text(Path("sjrpg_3d/tools/review/terrain_npc_observer.gd").read_text())
                  main = project / "scripts/main.gd"
                  text = main.read_text()
                  needle = '\t\tadd_child(preload("res://scripts/native_style_review.gd").new().setup(self))\n'
                  assert text.count(needle) == 1, "Exact explicit review observer insertion point"
                  text = text.replace(needle, needle + '\t\tadd_child(preload("res://scripts/terrain_npc_ci_observer.gd").new().setup(self))\n')
                  main.write_text(text)
                  PY
                  chmod +x "$SJRPG_REVIEW_PROJECT"/tools/*.sh
                  "$SJRPG_REVIEW_PROJECT/tools/export_web.sh"
                  echo "SJRPG_REVIEW_WEB=$SJRPG_REVIEW_PROJECT/build/web" >> "$GITHUB_ENV"
            - name: Photograph real native geometry and immutable physical surfaces
              run: |
                  set -euo pipefail
                  SJRPG_REVIEW_OUT="build/terrain-npc-review/$SJRPG_TERRAIN_EDITION"
                  mkdir -p "$SJRPG_REVIEW_OUT"
                  python3 -m http.server 8786 --bind 127.0.0.1 --directory "$SJRPG_REVIEW_WEB" > "$SJRPG_REVIEW_OUT/server.log" 2>&1 &
                  SJRPG_REVIEW_SERVER_PID=$!
                  trap 'kill "$SJRPG_REVIEW_SERVER_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8786/ > /dev/null
                  node sjrpg_3d/tools/check_terrain_npc.mjs http://127.0.0.1:8786/ "$SJRPG_REVIEW_OUT"
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: terrain-npc-${{ matrix.edition }}
                  path: build/terrain-npc-review/${{ matrix.edition }}
                  if-no-files-found: ignore
                  retention-days: 7
    compare:
        needs: capture
        runs-on: ubuntu-latest
        timeout-minutes: 8
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/download-artifact@v6
              with:
                  name: terrain-npc-before
                  path: build/terrain-npc-review/before
            - uses: actions/download-artifact@v6
              with:
                  name: terrain-npc-after
                  path: build/terrain-npc-review/after
            - name: Compare actual surfaces and publish preview blobs without modifying refs
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  python3 -m pip install --disable-pip-version-check Pillow
                  python3 sjrpg_3d/tools/compare_terrain_npc.py build/terrain-npc-review
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: terrain-npc-comparison
                  path: build/terrain-npc-review
                  if-no-files-found: ignore
                  retention-days: 7
