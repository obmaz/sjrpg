name: Compose verified GPU texture review

on:
    push:
        paths:
            - ".github/workflows/texture-review-report.yml"
    workflow_dispatch:
        inputs:
            capture_run_id:
                description: Completed actual texture capture workflow run
                required: true
                default: "42472571299"
                type: string

permissions:
    contents: write
    actions: read

jobs:
    compare:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@v6
              with:
                  name: texture-before
                  path: build/texture-compression-review/before
                  run-id: ${{ inputs.capture_run_id || '42472571299' }}
                  github-token: ${{ github.token }}
            - uses: actions/download-artifact@v6
              with:
                  name: texture-after
                  path: build/texture-compression-review/after
                  run-id: ${{ inputs.capture_run_id || '42472571299' }}
                  github-token: ${{ github.token }}
            - name: Verify capture source still matches all runtime visuals
              run: |
                  python3 - <<'PY'
                  import json, subprocess
                  from pathlib import Path
                  report = json.loads(Path("build/texture-compression-review/after/texture-compression.json").read_text())
                  ref = report["ref"]
                  paths = ["sjrpg_3d/scripts", "sjrpg_3d/scenes", "sjrpg_3d/project.godot", "sjrpg_3d/export_presets.cfg",
                           "sjrpg_3d/assets/data", "sjrpg_3d/assets/art", "sjrpg_3d/tools/texture_policy.py",
                           "sjrpg_3d/tools/check_texture_compression.mjs", "sjrpg_3d/tools/review/texture_compression_observer.gd",
                           ":(exclude,glob)sjrpg_3d/assets/art/**/*.import"]
                  subprocess.run(["git","diff","--exit-code",ref,"HEAD","--",*paths],check=True)
                  print("TEXTURE_CAPTURE_SOURCE_MATCH " + ref)
                  PY
            - name: Preserve exact-camera pairs and separately label the drifting live view
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  python3 -m pip install --disable-pip-version-check Pillow
                  python3 sjrpg_3d/tools/compare_texture_compression.py build/texture-compression-review
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: verified-gpu-texture-comparison
                  path: build/texture-compression-review
                  retention-days: 7
