name: Review save selection layout

on:
    push:
        paths:
            - ".github/workflows/save-layout-review.yml"
            - "sjrpg_3d/scripts/main.gd"
            - "sjrpg_3d/scripts/class_select.gd"
            - "sjrpg_3d/scripts/save_layout_review.gd"
            - "sjrpg_3d/tests/cases/entry_layout.gd"
            - "sjrpg_3d/tests/cases/save_layout.gd"
            - "sjrpg_3d/tools/check_save_layout.mjs"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: save-layout-review-${{ github.ref }}
    cancel-in-progress: true

jobs:
    review:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install browser harness
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Check save selection
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
                  tools/check.sh --project=3d --only=entry_layout,save_layout,save_time_label,save_slots
            - name: Export native UI for visual diagnostics
              if: success() || failure()
              run: sjrpg_3d/tools/export_web.sh
            - name: Run actual save layout browser harness
              if: success() || failure()
              run: |
                  mkdir -p build/save-layout-review
                  python3 -m http.server 8779 --bind 127.0.0.1 --directory sjrpg_3d/build/web > build/save-layout-review/server.log 2>&1 &
                  SJRPG_REVIEW_SERVER_PID=$!
                  trap 'kill "$SJRPG_REVIEW_SERVER_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8779/ > /dev/null
                  node sjrpg_3d/tools/check_save_layout.mjs http://127.0.0.1:8779/ build/save-layout-review
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: save-layout-review
                  path: build/save-layout-review
                  if-no-files-found: ignore
                  retention-days: 7
