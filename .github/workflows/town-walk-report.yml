name: Report completed town walking comparison
on:
    push:
        paths:
            - ".github/workflows/town-walk-report.yml"
            - "sjrpg_3d/tools/perf/summarize_town_walk.py"
    workflow_dispatch:
        inputs:
            source_run:
                description: Completed paired town walking workflow run
                default: "42439171278"
                required: true
            candidate_sha:
                description: Exact candidate app commit from that run
                default: "6a63c301e60055b74beb6a5f990af1cfe8e2e5b4"
                required: true
permissions:
    contents: read
    actions: read
jobs:
    report:
        runs-on: ubuntu-latest
        timeout-minutes: 6
        env:
            SOURCE_RUN: ${{ github.event.inputs.source_run || '42439171278' }}
            EXPECTED_BASELINE: 3f4c9fe347bd58fa2fc2c609671b4de549a1b09b
            EXPECTED_CANDIDATE: ${{ github.event.inputs.candidate_sha || '6a63c301e60055b74beb6a5f990af1cfe8e2e5b4' }}
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Verify completed original walking run and summary syntax
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  python3 -m py_compile sjrpg_3d/tools/perf/summarize_town_walk.py
                  python3 - <<'PY'
                  import json,os,urllib.request
                  from pathlib import Path
                  run=os.environ["SOURCE_RUN"]
                  assert run.isdigit(),"Run ID must be numeric"
                  url="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+run
                  request=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
                  metadata=json.load(urllib.request.urlopen(request,timeout=30))
                  assert metadata["name"]=="Reproduce continuous town walking memory"
                  assert metadata["status"]=="completed",metadata["status"]
                  assert metadata["head_sha"]==os.environ["EXPECTED_CANDIDATE"],metadata["head_sha"]
                  root=Path("build/walking-report")
                  root.mkdir(parents=True,exist_ok=True)
                  (root/"provenance.json").write_text(json.dumps({"run":run,"url":metadata["html_url"],"source_head":metadata["head_sha"],"conclusion":metadata["conclusion"]},indent=2))
                  PY
            - uses: actions/download-artifact@v6
              with:
                  github-token: ${{ github.token }}
                  run-id: ${{ env.SOURCE_RUN }}
                  pattern: town-walk-*
                  path: build/walking-input
            - name: Summarize actual existing measurements and emit source JPEGs
              run: python3 sjrpg_3d/tools/perf/summarize_town_walk.py build/walking-input build/walking-report
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: paired-town-walking-report
                  path: build/walking-report
                  if-no-files-found: ignore
                  retention-days: 7
