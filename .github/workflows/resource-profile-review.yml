name: Profile actual 3D resource lifecycle
# 자동 검증은 web.yml의 tools/ci.sh가 담당한다. 이 작업은 필요할 때 수동 실행한다.
on:
    workflow_dispatch:
permissions:
    contents: read
    actions: read
concurrency:
    group: resource-profile-${{ github.sha }}
    cancel-in-progress: false
jobs:
    profile:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                edition: [before, after]
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Prepare exact edition with identical observer only
              env:
                  EDITION: ${{ matrix.edition }}
              run: |
                  mkdir -p "$RUNNER_TEMP/resource-game"
                  if [ "$EDITION" = before ]; then
                      git fetch --no-tags --depth=1 origin f3fa9f32caa0cfde08f8f1627431816bde01e00f
                      git archive f3fa9f32caa0cfde08f8f1627431816bde01e00f | tar -x -C "$RUNNER_TEMP/resource-game"
                  else
                      git archive HEAD | tar -x -C "$RUNNER_TEMP/resource-game"
                  fi
                  cp sjrpg_3d/scripts/inspection/resource_profile_review.gd "$RUNNER_TEMP/resource-game/sjrpg_3d/scripts/inspection/resource_profile_review.gd"
                  cp sjrpg_3d/tools/check_resource_profile.mjs sjrpg_3d/tools/resource_telemetry.mjs "$RUNNER_TEMP/resource-game/sjrpg_3d/tools/"
                  python3 - <<'PY'
                  import os
                  from pathlib import Path
                  p=Path(os.environ["RUNNER_TEMP"])/"resource-game/sjrpg_3d/scripts/app/main.gd"
                  text=p.read_text()
                  if 'res://scripts/inspection/resource_profile_review.gd' not in text:
                      needle="\tshow_title()\n"
                      hook='\tif OS.has_feature("web") and str(JavaScriptBridge.eval("new URLSearchParams(window.location.search).get(\'resource_profile\')", true)) == "1":\n\t\tadd_child(load("res://scripts/inspection/resource_profile_review.gd").new().setup(self))\n'
                      assert needle in text
                      text=text.replace(needle,needle+hook,1)
                      p.write_text(text)
                  PY
                  ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/resource-game/node_modules"
                  chmod +x "$RUNNER_TEMP/resource-game/tools/"*.sh "$RUNNER_TEMP/resource-game/sjrpg_3d/tools/"*.sh
                  "$RUNNER_TEMP/resource-game/tools/setup_godot.sh"
            - name: Export real game edition
              working-directory: ${{ runner.temp }}/resource-game
              run: sjrpg_3d/tools/export_web.sh
            - name: Profile repeated actual menu, town and cave lifecycle
              env:
                  EDITION: ${{ matrix.edition }}
                  SJRPG_PROFILE_EDITION: ${{ matrix.edition }}
                  SJRPG_PROFILE_SHA: ${{ matrix.edition == 'before' && 'f3fa9f32caa0cfde08f8f1627431816bde01e00f' || github.sha }}
              run: |
                  mkdir -p "build/resource-review/$EDITION"
                  python3 -m http.server 8790 --bind 127.0.0.1 --directory "$RUNNER_TEMP/resource-game/sjrpg_3d/build/web" > "build/resource-review/$EDITION/server.log" 2>&1 &
                  SJRPG_PROFILE_SERVER=$!
                  trap 'kill "$SJRPG_PROFILE_SERVER" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8790/ > /dev/null
                  node "$RUNNER_TEMP/resource-game/sjrpg_3d/tools/check_resource_profile.mjs" http://127.0.0.1:8790/ "$GITHUB_WORKSPACE/build/resource-review/$EDITION"
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: resource-profile-${{ matrix.edition }}
                  path: build/resource-review/${{ matrix.edition }}
                  retention-days: 7
    compare:
        needs: profile
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/download-artifact@v4
              with:
                  name: resource-profile-before
                  path: build/resource-review/before
            - uses: actions/download-artifact@v4
              with:
                  name: resource-profile-after
                  path: build/resource-review/after
            - run: python3 sjrpg_3d/tools/compare_resource_profile.py build/resource-review
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: resource-profile-comparison
                  path: build/resource-review
                  retention-days: 7
