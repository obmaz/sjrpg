name: Review native objects and UI tone

on:
    push:
        paths:
            - ".github/workflows/native-style-review.yml"
            - "sjrpg_3d/scripts/native_*.gd"
            - "sjrpg_3d/scripts/ortho_3d*.gd"
            - "sjrpg_3d/scripts/hud*.gd"
            - "sjrpg_3d/scripts/potion_art.gd"
            - "sjrpg_3d/scripts/mobile_menu_art.gd"
            - "sjrpg_3d/scripts/touch_controls.gd"
            - "sjrpg_3d/scripts/skill_tree_panel.gd"
            - "sjrpg_3d/scripts/ui_tone_art.gd"
            - "sjrpg_3d/scripts/panel_frame.gd"
            - "sjrpg_3d/scripts/ui_kit.gd"
            - "sjrpg_3d/scripts/settings_panel.gd"
            - "sjrpg_3d/scripts/main.gd"
            - "sjrpg_3d/assets/art/hud/**"
            - "sjrpg_3d/assets/art/preview3d/**"
            - "sjrpg_3d/tests/cases/native_*.gd"
            - "sjrpg_3d/tests/cases/ortho_3d*.gd"
            - "sjrpg_3d/tests/cases/ui_tone.gd"
            - "sjrpg_3d/tools/check_native_style.mjs"
            - "sjrpg_3d/tools/compare_native_style.mjs"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: native-style-review-${{ github.sha }}
    cancel-in-progress: false

jobs:
    protect_pending_visual_review:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: write
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Retire older deploy runs that lack the visual review hold
              if: hashFiles('.native-style-review-hold') != ''
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  python3 - <<'PY'
                  import json, os, urllib.request, urllib.error
                  base = 'https://api.github.com/repos/' + os.environ['GH_REPO']
                  headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
                  def request(path, method='GET'):
                      req = urllib.request.Request(base + path, headers=headers, method=method)
                      with urllib.request.urlopen(req, timeout=30) as response:
                          data = response.read()
                          return json.loads(data) if data else {}
                  cutoff = request('/actions/runs/' + os.environ['GITHUB_RUN_ID'])['created_at']
                  for state in ('queued', 'in_progress'):
                      runs = request('/actions/runs?branch=main&status=' + state + '&per_page=100')['workflow_runs']
                      for run in runs:
                          if run['created_at'] > cutoff or run['event'] == 'pull_request':
                              continue
                          if run['name'] != 'Build web and deploy to GitHub Pages':
                              continue
                          try:
                              request('/contents/.native-style-review-hold?ref=' + run['head_sha'])
                              continue
                          except urllib.error.HTTPError as error:
                              if error.code != 404:
                                  raise
                          try:
                              request('/actions/runs/' + str(run['id']) + '/cancel', 'POST')
                              print('Cancelled pre-hold deploy run', run['id'], run['head_sha'])
                          except urllib.error.HTTPError as error:
                              if error.code != 409:
                                  raise
                  PY
    review:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install browser harness
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Check native UI scripts
              id: native_check
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
                  tools/check.sh --project=3d --only=entry_layout,native_residents,native_forest_props,native_warrior,native_enemy_models,ui_tone,native_environment,ortho_3d_preview,native_scenery_props,native_cave_geometry
            - name: Export native UI for visual diagnostics
              id: candidate_export
              if: success() || failure()
              run: sjrpg_3d/tools/export_web.sh
            - name: Export the actual baseline for paired comparisons
              id: baseline_export
              if: success()
              run: |
                  mkdir -p build/native-style-baseline
                  git fetch --depth=1 origin 3ec51c4bf4131da4a0e5dafa167a1db63709e714
                  git archive 3ec51c4bf4131da4a0e5dafa167a1db63709e714 | tar -x -C build/native-style-baseline
                  cp sjrpg_3d/scripts/native_style_review.gd build/native-style-baseline/sjrpg_3d/scripts/native_style_review.gd
                  python3 - <<'PY'
                  from pathlib import Path
                  p = Path('build/native-style-baseline/sjrpg_3d/scripts/main.gd')
                  hook = '\tif OS.has_feature("web") and str(JavaScriptBridge.eval("new URLSearchParams(window.location.search).get(\'native_style_review\')", true)) == "1":\n\t\tadd_child(preload("res://scripts/native_style_review.gd").new().setup(self))\n'
                  p.write_text(p.read_text().replace('\tshow_title()\n', '\tshow_title()\n' + hook, 1))
                  PY
                  chmod +x build/native-style-baseline/tools/*.sh build/native-style-baseline/sjrpg_3d/tools/*.sh
                  build/native-style-baseline/sjrpg_3d/tools/export_web.sh
            - name: Capture the actual baseline
              id: baseline_capture
              if: "!cancelled() && steps.native_check.outcome == 'success' && steps.baseline_export.outcome == 'success'"
              continue-on-error: true
              run: |
                  mkdir -p build/native-style-review/before
                  python3 -m http.server 8780 --bind 127.0.0.1 --directory build/native-style-baseline/sjrpg_3d/build/web > build/native-style-review/before/server.log 2>&1 &
                  SJRPG_STYLE_BEFORE_PID=$!
                  trap 'kill "$SJRPG_STYLE_BEFORE_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8780/ > /dev/null
                  SJRPG_STYLE_BASELINE=1 node sjrpg_3d/tools/check_native_style.mjs http://127.0.0.1:8780/ build/native-style-review/before
            - name: Check the actual candidate regardless of baseline defects
              if: "!cancelled() && steps.native_check.outcome == 'success' && steps.candidate_export.outcome == 'success'"
              run: |
                  mkdir -p build/native-style-review/after
                  python3 -m http.server 8781 --bind 127.0.0.1 --directory sjrpg_3d/build/web > build/native-style-review/after/server.log 2>&1 &
                  SJRPG_STYLE_AFTER_PID=$!
                  trap 'kill "$SJRPG_STYLE_AFTER_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8781/ > /dev/null
                  node sjrpg_3d/tools/check_native_style.mjs http://127.0.0.1:8781/ build/native-style-review/after
            - name: Compose actual before and after screenshots
              if: "!cancelled() && steps.native_check.outcome == 'success'"
              run: node sjrpg_3d/tools/compare_native_style.mjs build/native-style-review
            - name: Report an incomplete baseline run after retaining candidate diagnostics
              if: "!cancelled() && steps.baseline_capture.outcome == 'failure'"
              run: exit 1
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: native-style-review
                  path: build/native-style-review
                  if-no-files-found: ignore
                  retention-days: 7
