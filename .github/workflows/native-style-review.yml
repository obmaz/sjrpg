name: Review native objects and UI tone

on:
    push:
        paths:
            - ".github/workflows/native-style-review.yml"
            - "sjrpg_3d/scripts/**"
            - "sjrpg_3d/tests/cases/**"
            - "sjrpg_3d/tools/check_native_style.mjs"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: native-style-review-${{ github.ref }}
    cancel-in-progress: true

jobs:
    review:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install browser harness
              run: |
                  npm ci --ignore-scripts
                  npx playwright install --with-deps chromium
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Check native UI scripts
              run: |
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
                  tools/check.sh --project=3d --only=entry_layout,native_residents,native_forest_props
            - name: Export native UI for visual diagnostics
              if: success() || failure()
              run: sjrpg_3d/tools/export_web.sh
            - name: Run actual native style browser harness
              if: success() || failure()
              run: |
                  mkdir -p build/native-style-review
                  python3 -m http.server 8781 --bind 127.0.0.1 --directory sjrpg_3d/build/web > build/native-style-review/server.log 2>&1 &
                  SJRPG_REVIEW_SERVER_PID=$!
                  trap 'kill "$SJRPG_REVIEW_SERVER_PID" 2>/dev/null || true' EXIT
                  curl --fail --silent --show-error --max-time 2 --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 12 http://127.0.0.1:8781/ > /dev/null
                  node sjrpg_3d/tools/check_save_layout.mjs http://127.0.0.1:8781/ build/native-style-review
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: native-style-review
                  path: build/native-style-review
                  if-no-files-found: ignore
                  retention-days: 7
