name: Diagnose headless audio mix shutdown
# Workspace-only test runner experiment. Never builds or deploys a site.
# 자동 검증은 web.yml의 tools/ci.sh가 담당한다. 이 작업은 필요할 때 수동 실행한다.
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: audio-mix-shutdown-diagnostics-${{ github.sha }}
    cancel-in-progress: false
jobs:
    compare:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                variant: [quick-1, quick-2, quick-3, full]
        env:
            SJRPG_AUDIO_VARIANT: ${{ matrix.variant }}
            SJRPG_AUDIO_QUICK: actor_atlas_lazy,entry_probe_budget,native_render_budget,render_quality,native_enemy_models,native_enemy_scale,native_enemy_radius,corpses,melee_elevation,spatial_combat,world_zoom,entry_layout,gamepad_gameplay,ui_input
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  ref: 67dfea19bdaadab39b4a71bb406dd2c22b8a577f
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.godot-tools
                      ~/.local/share/godot/export_templates
                  key: godot-${{ hashFiles('.godot-version') }}-tools-v1
            - name: Prepare the exact immutable baseline
              run: |
                  test "$(git rev-parse HEAD)" = 67dfea19bdaadab39b4a71bb406dd2c22b8a577f
                  test "$(git hash-object sjrpg_3d/tests/run_all.gd)" = 2d53a5df1edcd2fa246565ed6a5df74f0c106179
                  test "$(git hash-object sjrpg_3d/scripts/music_director.gd)" = 7121cdaa3206495dd9e38de98af73a7e966fd98e
                  chmod +x tools/*.sh sjrpg_3d/tools/*.sh
                  tools/setup_godot.sh
                  mkdir -p build/audio-mix-diagnostics
                  python3 - <<'PY'
                  import json, os
                  from pathlib import Path
                  names=sorted(p.stem for p in Path("sjrpg_3d/tests/cases").glob("*.gd"))
                  quick=os.environ["SJRPG_AUDIO_QUICK"].split(",")
                  assert len(names)==109 and len(quick)==14 and all(n in names for n in quick)
                  Path("build/audio-mix-diagnostics/selection.json").write_text(json.dumps({
                      "source":"67dfea19bdaadab39b4a71bb406dd2c22b8a577f",
                      "variant":os.environ["SJRPG_AUDIO_VARIANT"],"baseline_cases":quick,
                      "candidate_cases":names if os.environ["SJRPG_AUDIO_VARIANT"]=="full" else quick},indent=2))
                  PY
            - name: Run the original undrained quick suite on this same worker
              run: |
                  set +e
                  timeout 300 tools/check.sh --project=3d --only="$SJRPG_AUDIO_QUICK" > build/audio-mix-diagnostics/baseline.log 2>&1
                  SJRPG_BASELINE_CODE=$?
                  set -e
                  printf '%s\n' "$SJRPG_BASELINE_CODE" > build/audio-mix-diagnostics/baseline.exitcode
                  cat build/audio-mix-diagnostics/baseline.log
                  # Preserve the genuine baseline result; never let it hide the paired experiment.
                  echo "AUDIO_BASELINE_EXIT=$SJRPG_BASELINE_CODE"
            - name: Overlay only the experimental test runner in this workspace
              uses: actions/github-script@v8
              with:
                  script: |
                      const fs=require('fs');
                      const blob=(await github.rest.git.getBlob({owner:'obmaz',repo:'sjrpg',
                        file_sha:'0188d34a974ad7a354ed66a3df42dea7dca1593a'})).data;
                      if(blob.sha!=='0188d34a974ad7a354ed66a3df42dea7dca1593a'||blob.encoding!=='base64')
                        throw new Error('Unexpected experimental runner blob');
                      fs.writeFileSync('sjrpg_3d/tests/run_all.gd',Buffer.from(blob.content,'base64'));
            - name: Run the unchanged assertions with the engine-boundary test teardown
              run: |
                  test "$(git hash-object sjrpg_3d/tests/run_all.gd)" = 0188d34a974ad7a354ed66a3df42dea7dca1593a
                  test "$(git hash-object sjrpg_3d/scripts/music_director.gd)" = 7121cdaa3206495dd9e38de98af73a7e966fd98e
                  set +e
                  if test "$SJRPG_AUDIO_VARIANT" = full; then
                      timeout 1200 tools/check.sh --project=3d > build/audio-mix-diagnostics/candidate.log 2>&1
                  else
                      timeout 300 tools/check.sh --project=3d --only="$SJRPG_AUDIO_QUICK" > build/audio-mix-diagnostics/candidate.log 2>&1
                  fi
                  SJRPG_CANDIDATE_CODE=$?
                  set -e
                  printf '%s\n' "$SJRPG_CANDIDATE_CODE" > build/audio-mix-diagnostics/candidate.exitcode
                  cat build/audio-mix-diagnostics/candidate.log
                  echo "AUDIO_CANDIDATE_EXIT=$SJRPG_CANDIDATE_CODE"
            - name: Retain both strict outcomes without filtering engine errors
              if: always()
              run: |
                  python3 - <<'PY'
                  import json, os, re
                  from pathlib import Path
                  directory=Path("build/audio-mix-diagnostics")
                  directory.mkdir(parents=True,exist_ok=True)
                  report={"diagnostic_only":True,"variant":os.environ["SJRPG_AUDIO_VARIANT"]}
                  for name,expected in (("baseline",14),("candidate",109 if os.environ["SJRPG_AUDIO_VARIANT"]=="full" else 14)):
                      log=(directory/(name+".log")).read_text() if (directory/(name+".log")).exists() else ""
                      code=int((directory/(name+".exitcode")).read_text()) if (directory/(name+".exitcode")).exists() else -1
                      complete=bool(re.search(r"^RESULT cases="+str(expected)+r" failed=0 ",log,re.M))
                      errors=[line for line in log.splitlines() if re.search(r"SCRIPT ERROR|^ERROR:",line)]
                      report[name]={"exitcode":code,"all_assertions_passed":complete,
                          "engine_errors":errors,"strict_passed":code==0 and complete and not errors}
                  (directory/"comparison.json").write_text(json.dumps(report,indent=2))
                  print("AUDIO_SHUTDOWN_COMPARISON "+json.dumps(report),flush=True)
                  # A failing baseline remains a failing diagnostic job, even if the
                  # candidate is clean. Candidate strict results are preserved separately.
                  assert report["baseline"]["strict_passed"] and report["candidate"]["strict_passed"], "At least one strict run failed; both original logs are preserved"
                  PY
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: audio-mix-shutdown-${{ matrix.variant }}
                  path: build/audio-mix-diagnostics
                  if-no-files-found: ignore
                  retention-days: 7
