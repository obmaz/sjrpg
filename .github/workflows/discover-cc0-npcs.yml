name: Discover actual CC0 NPC source candidates
# 자동 검증은 web.yml의 tools/ci.sh가 담당한다. 이 작업은 필요할 때 수동 실행한다.
on:
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: discover-cc0-npcs-${{ github.sha }}
    cancel-in-progress: false
jobs:
    inspect:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Check fixed Standard archive licenses and actual model metadata
              run: python3 sjrpg_3d/tools/assets/heroes/discover_cc0_npcs.py
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: cc0-npc-source-discovery
                  path: sjrpg_3d/build/public-npc-source-discovery
                  if-no-files-found: error
                  retention-days: 7
