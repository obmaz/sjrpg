name: Pack shared reference slate
on:
    push:
        paths:
            - ".github/workflows/pack-village-slate.yml"
            - "sjrpg_3d/tools/preview3d/prepare_limestone.py"
            - "sjrpg_3d/tools/preview3d/prepare_materials.py"
            - "sjrpg_3d/assets/source/preview3d/town-slate/generated.png"
            - "sjrpg_3d/assets/source/preview3d/town-slate/generation.json"
    workflow_dispatch:
permissions:
    contents: write
concurrency:
    group: village-slate-${{ github.sha }}
    cancel-in-progress: false
jobs:
    pack:
        runs-on: ubuntu-latest
        timeout-minutes: 8
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Install standard image encoder
              run: python3 -m pip install --disable-pip-version-check Pillow
            - name: Verify syntax and pack the exact source without moving refs
              env:
                  SJRPG_ASSET_TOKEN: ${{ github.token }}
              run: |
                  python3 -m py_compile sjrpg_3d/tools/preview3d/prepare_limestone.py sjrpg_3d/tools/preview3d/prepare_materials.py
                  python3 sjrpg_3d/tools/preview3d/prepare_limestone.py --material=slate
            - uses: actions/upload-artifact@v6
              if: always()
              with:
                  name: village-slate-candidate
                  path: |
                      sjrpg_3d/build/town-slate
                      sjrpg_3d/assets/art/preview3d/slate.webp
                  if-no-files-found: ignore
                  retention-days: 7
