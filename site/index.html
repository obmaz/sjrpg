<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="data:," />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#102f2d" />
        <title>자연의 수호자 · 모험 선택</title>
        <style>
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            body {
                display: grid;
                place-items: center;
                padding: max(18px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
                    max(18px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
                font-family: system-ui, sans-serif;
                color: #f0e5c8;
                background:
                    linear-gradient(#102c2980, #0a2424ed),
                    url('{{legacyAssets}}/village-scene.webp') center / cover;
            }
            main {
                width: min(420px, 100%);
                text-align: center;
            }
            h1 {
                margin: 0;
                font-size: clamp(25px, 6vw, 34px);
                text-shadow: 0 3px 16px #0008;
            }
            p {
                margin: 10px 0 24px;
                color: #bed0bd;
                font-size: 14px;
            }
            nav {
                display: grid;
                gap: 12px;
            }
            a {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                min-height: 80px;
                padding: 15px 22px;
                color: #f0e5c8;
                text-decoration: none;
                text-align: left;
                background: #12352ff2;
                border: 1px solid #8a8863;
                border-radius: 14px;
                box-shadow: 0 8px 24px #0004;
            }
            a:first-child {
                background: linear-gradient(120deg, #355c45f2, #173a32f2);
                border: 2px solid #d5b772;
            }
            strong {
                display: block;
                font-size: 22px;
            }
            small {
                display: block;
                margin-top: 3px;
                font-size: 12px;
                color: #bfcebb;
            }
            .tag {
                color: #e3c77f;
                font-size: 12px;
                letter-spacing: 1px;
            }
            a:hover {
                filter: brightness(1.12);
            }
            a:focus-visible {
                outline: 3px solid #a5f7df;
                outline-offset: 4px;
            }
            @media (max-height: 360px) {
                main {
                    width: min(560px, 100%);
                }
                nav {
                    grid-template-columns: 1fr 1fr;
                }
                p {
                    margin: 7px 0 16px;
                }
                a {
                    min-height: 74px;
                    padding: 12px;
                    gap: 6px;
                }
                strong {
                    font-size: 19px;
                }
                .tag {
                    font-size: 10px;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>자연의 수호자</h1>
            <p>플레이할 버전을 선택하세요</p>
            <nav aria-label="게임 버전">
                <a href="new/" aria-label="새로운 모험 시작">
                    <span><strong>새로운 모험</strong><small>전사 · 마법사</small></span>
                    <span class="tag">NEW ›</span>
                </a>
                <a href="legacy/" aria-label="기존 모험 플레이">
                    <span><strong>기존 모험</strong><small>이전 버전</small></span>
                    <span class="tag">LEGACY ›</span>
                </a>
            </nav>
        </main>
    </body>
</html>
